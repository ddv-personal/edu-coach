<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Компас</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0d1117;
  --surface:   #13181f;
  --card:      #181e27;
  --border:    #1f2837;
  --mat:       #4facfe;
  --mat-soft:  rgba(79,172,254,0.10);
  --mat-glow:  rgba(79,172,254,0.30);
  --bel:       #f7b731;
  --bel-soft:  rgba(247,183,49,0.10);
  --bel-glow:  rgba(247,183,49,0.28);
  --lit:       #a78bfa;
  --lit-soft:  rgba(167,139,250,0.10);
  --lit-glow:  rgba(167,139,250,0.30);
  --user-bg:   #1a2235;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --radius:    16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;min-height:100%;position:relative}

/* Setup screen CSS removed */

/* ── HEADER ── */
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);z-index:20}
.h-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--mat),var(--lit));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 0 14px rgba(167,139,250,.3)}
.h-info{flex:1;min-width:0}
.h-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em}

.h-btn{flex-shrink:0;background:none;border:1.5px solid transparent;border-radius:20px;font-size:12px;padding:6px 12px;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:'Inter',sans-serif}
.h-btn:hover{border-color:var(--lit);color:var(--lit)}
.h-btn-icon{padding:6px 10px}
.h-theme{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--lit);background:var(--lit-soft);border-radius:10px;padding:1px 8px;margin-top:2px}

/* ── MESSAGES ── */
#messages{padding:78px 14px 190px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
.day-label{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:4px 0}

/* ── MISSION CARD WITH TABS ── */
.mission-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);animation:springUp .45s cubic-bezier(0.34,1.56,0.64,1) both}
.tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:63px;background:var(--card);z-index:5;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 6px 9px;cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif;position:relative;transition:background .15s}
.tab .tab-icon{font-size:0;position:relative;line-height:1}.tab .tab-icon i{font-size:21px;color:var(--muted)}.tab[data-tab="mat"].active .tab-icon i{color:var(--mat)}.tab[data-tab="bel"].active .tab-icon i{color:var(--bel)}.tab[data-tab="lit"].active .tab-icon i{color:var(--lit)}.tab[data-tab="mat"]:not(.active) .tab-icon i{color:var(--mat);opacity:0.45}.tab[data-tab="bel"]:not(.active) .tab-icon i{color:var(--bel);opacity:0.45}.tab[data-tab="lit"]:not(.active) .tab-icon i{color:var(--lit);opacity:0.45}
.tab .tab-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tab .tab-count{font-size:14px;font-weight:700;color:var(--muted);font-family:'Space Grotesk',sans-serif;line-height:1;opacity:1}.tab[data-tab="mat"].active .tab-count{color:var(--mat)}.tab[data-tab="bel"].active .tab-count{color:var(--bel)}.tab[data-tab="lit"].active .tab-count{color:var(--lit)}
.tab.active .tab-label{color:var(--text)}
.tab .seen-check{display:none;position:absolute;top:-3px;right:-9px;font-size:10px}
.tab.seen .seen-check{display:inline}
.tab::after{content:'';position:absolute;bottom:0;left:12%;right:12%;height:2px;border-radius:2px;background:transparent;transition:background .2s}
.tab[data-tab="mat"].active::after{background:var(--mat)}
.tab[data-tab="bel"].active::after{background:var(--bel)}
.tab[data-tab="lit"].active::after{background:var(--lit)}
.tab[data-tab="mat"].active{background:var(--mat-soft)}
.tab[data-tab="bel"].active{background:var(--bel-soft)}
.tab[data-tab="lit"].active{background:var(--lit-soft)}
.tab:hover:not(.active){background:rgba(255,255,255,0.02)}

.tab-panel{padding:16px;scroll-margin-top:115px}
.tab-panel + .tab-panel{border-top:1px solid var(--border)}
.section-tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.tab-panel.mat .section-tag{color:var(--mat)}.tab-panel.mat .section-tag i{font-size:18px;color:var(--mat)}
.tab-panel.bel .section-tag{color:var(--bel)}.tab-panel.bel .section-tag i{font-size:18px;color:var(--bel)}
.tab-panel.lit .section-tag{color:var(--lit)}.tab-panel.lit .section-tag i{font-size:18px;color:var(--lit)}

.task-row{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.task-row:last-child{border-bottom:none}
.task-badge{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:'Space Grotesk',sans-serif;margin-top:1px}
.task-row.mat .task-badge{background:var(--mat-soft);color:var(--mat);border:1px solid rgba(79,172,254,0.35)}
.task-row.bel .task-badge{background:var(--bel-soft);color:var(--bel);border:1px solid rgba(247,183,49,0.35)}
.task-text{flex:1;font-size:14px;line-height:1.6;color:var(--text);padding-top:1px}

/* lit panel special layout */
.lit-card{background:var(--lit-soft);border:1px solid rgba(167,139,250,0.25);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.lit-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.lit-icon{font-size:22px;flex-shrink:0}
.lit-work{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--lit)}
.lit-author{font-size:12px;color:var(--muted);margin-top:1px}
.lit-time{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--lit);background:rgba(167,139,250,0.15);border-radius:10px;padding:2px 9px;margin-top:8px}
.lit-poem{font-style:italic;font-size:13.5px;line-height:1.7;color:#cbd5e1;border-left:2px solid rgba(167,139,250,0.4);padding-left:12px;margin-top:10px;white-space:pre-wrap}
.lit-questions{display:flex;flex-direction:column;gap:0}
.task-row.lit .task-badge{background:var(--lit-soft);color:var(--lit);border:1px solid rgba(167,139,250,0.35)}

.mission-footer{padding:12px 16px 0;border-top:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);display:flex;flex-direction:column;gap:10px}
.mission-footer-photo{font-size:11.5px;color:var(--muted);padding-bottom:12px}
.chess-reward{border-radius:12px;overflow:hidden;transition:all .3s}
.chess-reward.locked{background:rgba(255,255,255,0.03);border:1px dashed var(--border)}
.chess-reward.unlocked{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.35);box-shadow:0 0 16px rgba(251,191,36,0.1)}
.chess-reward-inner{display:flex;align-items:center;gap:10px;padding:10px 14px}
.chess-reward-icon{font-size:20px;flex-shrink:0;transition:filter .3s}
.chess-reward.locked .chess-reward-icon{filter:grayscale(1);opacity:0.4}
.chess-reward-text{flex:1;min-width:0}
.chess-reward-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.chess-reward.locked .chess-reward-title{color:var(--muted)}
.chess-reward-sub{font-size:11px;color:var(--muted);line-height:1.4}
.chess-reward.unlocked .chess-reward-sub{color:rgba(251,191,36,0.8)}
.chess-play-btn{flex-shrink:0;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:10px;color:#1a1000;font-size:12px;font-weight:700;padding:8px 14px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .18s;white-space:nowrap}
.chess-play-btn:hover{transform:scale(1.05);box-shadow:0 0 14px rgba(251,191,36,0.5)}
@keyframes unlock-pulse{0%{box-shadow:0 0 0 0 rgba(251,191,36,0.5)}70%{box-shadow:0 0 0 10px rgba(251,191,36,0)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}}
.chess-reward.just-unlocked{animation:unlock-pulse 0.6s ease 2}
.chess-progress-pills{display:flex;gap:4px;flex-shrink:0}
.chess-pip{width:10px;height:10px;border-radius:50%;background:var(--border);transition:background .3s}
.chess-pip.done{background:#fbbf24}
/* ── FLOATING CHESS BUTTON (появява се след unlock) ── */
#chess-float-btn{position:fixed;bottom:90px;right:16px;z-index:25;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(251,191,36,0.45);transition:all .2s;display:none;align-items:center;justify-content:center}
#chess-float-btn.visible{display:flex}
#chess-float-btn:hover{transform:scale(1.1);box-shadow:0 6px 22px rgba(251,191,36,0.6)}
@keyframes float-in{from{opacity:0;transform:scale(0.5) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
#chess-float-btn.visible{animation:float-in .3s cubic-bezier(.34,1.56,.64,1) both}

/* ── CHAT BUBBLES ── */
.msg{display:flex;flex-direction:column;max-width:82%;gap:3px;animation:springUp .3s cubic-bezier(0.34,1.56,0.64,1) both}
.msg.coach{align-self:flex-start}
.msg.user{align-self:flex-end}
.bubble{padding:11px 15px;border-radius:var(--radius);line-height:1.6;white-space:pre-wrap;word-break:break-word;font-size:14px}
.coach .bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:6px}.bubble.featured{border-left:3px solid var(--lit);background:rgba(167,139,250,0.06);}
.user .bubble{background:var(--user-bg);border:1px solid #243051;border-bottom-right-radius:6px;color:#c8d8ff}
.msg-meta{font-size:10px;color:var(--muted);padding:0 4px}
.coach .msg-meta{text-align:left}
.user .msg-meta{text-align:right}
.bubble img{max-width:220px;border-radius:10px;margin-top:8px;display:block}

.typing-bubble{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);border-bottom-left-radius:6px;padding:14px 18px;display:flex;gap:5px;align-items:center}
.typing-bubble span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing-bubble span:nth-child(2){animation-delay:.2s}
.typing-bubble span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes springUp{0%{opacity:0;transform:translateY(14px) scale(0.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slideInTask{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes compassSpin{from{transform:rotate(-25deg) scale(0.85)}to{transform:rotate(0deg) scale(1)}}

/* ── QUICK REPLIES ── */
#footer-area{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface)}
#quick-replies{display:flex;gap:7px;padding:8px 14px 8px;overflow-x:auto}
#quick-replies:empty{padding:0}
#quick-replies::-webkit-scrollbar{display:none}
.qr{flex-shrink:0;font-size:12.5px;padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .18s;white-space:nowrap;font-family:'Inter',sans-serif}
.qr:hover{border-color:var(--lit);color:var(--lit);background:var(--lit-soft)}

/* ── UPLOAD PREVIEW ── */
#upload-preview{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-top:1px solid var(--border)}
#upload-preview.visible{display:flex}
#preview-img{height:44px;border-radius:8px;object-fit:cover}
#preview-name{font-size:12px;color:var(--muted);flex:1}
#remove-upload{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}

/* ── INPUT ── */
#input-area{display:flex;align-items:flex-end;gap:9px;padding:10px 14px 14px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
#user-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:10px 16px;resize:none;outline:none;max-height:130px;overflow-y:auto;line-height:1.4;transition:border-color .2s}
#user-input::placeholder{color:var(--muted)}
#user-input:focus{border-color:var(--lit)}
#upload-btn{width:36px;height:36px;border-radius:50%;background:none;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);transition:all .2s}
#upload-btn:hover{border-color:var(--mat);color:var(--mat)}
#file-input{display:none}
#send-btn{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--mat),var(--lit));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;box-shadow:0 0 12px var(--lit-glow)}
#send-btn:hover{transform:scale(1.08);box-shadow:0 0 20px var(--lit-glow)}
#send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
/* ── PROGRESS / ARCHIVE OVERLAY ── */
#progress-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:150;display:none;align-items:flex-end;justify-content:center}
#progress-overlay.visible{display:flex}
.po-panel{width:100%;max-width:480px;max-height:88vh;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideUp .35s cubic-bezier(0.34,1.56,0.64,1) both;border:1px solid var(--border);border-bottom:none}
@keyframes slideUp{from{transform:translateY(40px) scale(0.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.po-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;flex-shrink:0}
.po-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}
.po-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
.po-tabs{display:flex;gap:6px;padding:0 14px 12px;flex-shrink:0}
.po-tab{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--muted);font-size:12px;font-weight:600;padding:9px 6px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.po-tab.active{background:var(--lit-soft);border-color:rgba(167,139,250,0.4);color:var(--lit)}
.po-body{flex:1;overflow-y:auto;padding:4px 18px 24px}
.po-body::-webkit-scrollbar{width:3px}
.po-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.po-note{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:14px;line-height:1.5}

/* history list */
.hist-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.hist-card:hover{border-color:rgba(167,139,250,0.35)}
.hist-top{display:flex;align-items:center;justify-content:space-between}
.hist-date{font-size:12px;color:var(--muted)}
.hist-theme{font-size:11px;color:var(--lit);display:flex;align-items:center;gap:4px}
.hist-summary{font-size:13px;color:var(--text);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.hist-pill{font-size:11px;padding:2px 8px;border-radius:8px}
.hist-pill.mat{background:var(--mat-soft);color:var(--mat)}
.hist-pill.bel{background:var(--bel-soft);color:var(--bel)}
.hist-pill.lit{background:var(--lit-soft);color:var(--lit)}

/* reading checklist */
.read-progress{font-size:12px;color:var(--muted);margin-bottom:12px}
.read-group-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.read-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.read-check{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:1px}
.read-item.done .read-check{background:var(--lit);border-color:var(--lit);color:#fff}
.read-text{font-size:13px;line-height:1.4}
.read-item.done .read-text{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(100,116,139,0.4)}
.read-author{color:var(--muted);font-size:11.5px}

/* skills grid */
.skill-group-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}
.skill-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.skill-code{flex-shrink:0;width:30px;font-size:11px;font-weight:700;color:var(--muted);font-family:'Space Grotesk',sans-serif}
.skill-label{flex:1;font-size:12.5px;color:var(--text)}
.skill-dot{flex-shrink:0;width:9px;height:9px;border-radius:50%}
.skill-dot.good{background:var(--lit);box-shadow:0 0 6px var(--lit-glow)}
.skill-dot.some{background:var(--bel)}
.skill-dot.none{background:var(--border)}

/* ── MISSED DAY PROMPT ── */
.missed-day-choice{display:flex;gap:8px;max-width:100%}
.md-btn{flex:1;border-radius:14px;padding:11px 14px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .18s;border:1px solid transparent}
.md-btn.primary{background:linear-gradient(135deg,var(--mat),var(--lit));color:#fff;box-shadow:0 0 12px var(--lit-glow)}
.md-btn.primary:hover{opacity:.9;transform:translateY(-1px)}
.md-btn.secondary{background:var(--card);border-color:var(--border);color:var(--muted)}
.md-btn.secondary:hover{border-color:var(--lit);color:var(--lit)}
/* ── CHESS OVERLAY ── */
#chess-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:160;display:none;align-items:center;justify-content:center;padding:16px}
#chess-overlay.visible{display:flex}
.chess-panel{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:420px;max-height:95vh;overflow-y:auto;display:flex;flex-direction:column}
.chess-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.chess-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700}
.chess-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px}
.chess-status{padding:10px 16px;font-size:13px;color:var(--text);background:var(--surface);border-bottom:1px solid var(--border);min-height:44px;flex-shrink:0;line-height:1.5}
.chess-status.thinking{color:var(--muted);font-style:italic}
.chess-board-wrap{padding:12px;flex-shrink:0}
.chess-board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid var(--border)}
.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(22px,6vw,38px);cursor:pointer;position:relative;transition:background .1s;user-select:none}
.sq.light{background:#d4b896}
.sq.dark{background:#8b5e3c}
.sq.selected{background:#f0d060 !important}
.sq.valid-move::after{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,0.25)}
.sq.valid-capture::after{content:'';position:absolute;inset:0;border:3px solid rgba(0,0,0,0.3);border-radius:2px}
.sq:hover:not(.selected){opacity:0.85}

  if (name === 'history') renderHistoryTab();
  else if (name === 'reading') renderReadingTab();

function renderHistoryTab() {
  poBody.innerHTML = `<div class="po-note">📋 Примерни данни — реалната история ще се пази в Google Sheets, веднъж свързан бекендът.</div>`;

  const total = REQUIRED_READING.reduce((s,g)=>s+g.items.length,0);

  });

function renderSkillsTab() {

- Преди да кажеш на ученика, че има грешка, ВИНАГИ първо сам пресметни верния отговор — НЕ наум, а ЯВНО, разпиши всяка стъпка на изчислението, особено събиране, изваждане, умножение. Никога не разчитай на бърза мисловна сметка — тя е точно толкова податлива на грешки, колкото на ученика.
- При проверка на изваждане или събиране с по-големи числа — разбий на по-лесни стъпки (напр. 95 − 36 = 95 − 30 − 6 = 65 − 6 = 59), за да намалиш риска от грешка.
- Никога не задавай риторичен въпрос от типа "Провери: X колко е всъщност?" без САМ да си показал явно изчислението, довело до верния отговор. Ако не можеш да покажеш изчислението стъпка по стъпка, не твърди, че има грешка.
- Ако проверяваш снимка на ръкописно решение — прочети ВСЯКА цифра поотделно и внимателно, особено ако почеркът е неясен. При съмнение за конкретна цифра или знак, попитай ученика да поясни вместо да приемеш грешно тълкуване.
- Грешно обявяване на правилен отговор за грешен е по-лошо от пропусната истинска грешка — то руши увереността на ученика в собствените му способности. При всяка несигурност — питай, не предполагай.
- Ако след собствена явна проверка установиш, че отговорът на ученика е верен, кажи го ясно и директно, без излишни уговорки.

ПРАВИЛА ЗА ОБРАТНА ВРЪЗКА:
- Винаги ПЪРВО нещо конкретно похвали
- После посочи грешките с обяснение ЗАЩО са грешки
- Никога не давай пълния отговор докато ученикът не е опитал поне веднъж
- Ако е заседнал — давай подсказки, не решения

АДАПТАЦИЯ:
- 3 последователни верни → увеличи трудността или нов материал
- 1+ грешки → върни се с по-лесна версия, после средна, после НВО ниво

МАТЕМАТИКА — само материал, който детето вече е учило:
УЧЕНО ДО КРАЯ НА 6-ТИ КЛАС (използвай свободно): числа (естествени, цели, рационални, степени, корени), изрази с променливи, уравнения от 1-ва степен, пропорции/проценти/лихви, триъгълник/четириъгълник/трапец (лице, периметър), Питагорова теорема, окръжност, координатна система, статистика.
НОВО В 7-МИ КЛАС (само ако детето покаже, че го знае): неравенства, многочлени и разлагане на множители, системи уравнения, квадратна функция, подобни триъгълници, вписан/описан многоъгълник, призма/пирамида/конус/цилиндър, вероятности.
СТРОГО ЗАБРАНЕНО: тригонометрия (sin, cos, tan), логаритми, производни, интеграли, комплексни числа.

ЗАДЪЛЖИТЕЛНА ЛИТЕРАТУРА ЗА НВО:
Стихотворения/разкази: „Хайдути" и „На прощаване в 1868 г." (Христо Ботев); „Хубава си, моя горо" (Любен Каравелов); „Отечество любезно...", „Опълченците на Шипка", „Българският език", „Една българка" (Иван Вазов); „Стани, стани, юнак балкански", „Вятър ечи, Балкан стене" (Добри Чинтулов); „Братчетата на Гаврош" (Христо Смирненски); „Серафим", „По жицата" (Йордан Йовков); „Косачи", „По жътва" (Елин Пелин); „Художник" (Веселин Ханчев); „Неразделни" (Пенчо Славейков); „Заточеници" (Пейо Яворов).
По-дълги творби: Из „Под игото" — глави „Представлението" и „Радини вълнения" (Вазов); Из „Немили-недраги" — глави I, II, III, V, X, епилог (Вазов); Из „Бай Ганьо" — глава „Бай Ганьо пътува" (Алеко Константинов); Из „До Чикаго и назад" (Алеко Константинов).

ЛОГИКА ЗА ЛИТЕРАТУРА: избери творба от списъка, обяви я директно (без да питаш дали е чел), дай времева оценка за четене, после въпросите веднага. НЕ цитирай и не възпроизвеждай текста на творбата (стихотворение или откъс) — ученикът вече има пълния списък с заглавия и автори и може сам да го открие и прочете. Само споменавай заглавие, автор и приблизително време за четене. Ротация — не повтаряй вече покрита творба.

КОМПЕТЕНТНОСТИ ЗА РОТАЦИЯ:

function getThemeColor(theme) {

  for (const [k, v] of Object.entries(hints)) {
    if ((theme?.hint || '').toLowerCase().includes(k)) return v;

  return '#a78bfa';
}

function compressImage(dataUrl, maxBytes, callback) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    // Max dimension 1600px — достатъчно за четене на ръкопис
    const MAX_DIM = 1600;
    let w = img.width, h = img.height;
    if (w > MAX_DIM || h > MAX_DIM) {
      if (w > h) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
      else       { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
    }
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);

    // Намаляй качеството докато не е под maxBytes
    let quality = 0.85;
    let result = canvas.toDataURL('image/jpeg', quality);
    while (result.length * 0.75 > maxBytes && quality > 0.3) {
      quality -= 0.1;
      result = canvas.toDataURL('image/jpeg', quality);
    }
    callback(result);
  };
  img.src = dataUrl;
}

function sendMessage() {
  const text = inputEl.value.trim();
  if((!text && !pendingImageBase64) || isLoading) return;
  const contentParts = [];
  if(pendingImageBase64) contentParts.push({type:'image',source:{type:'base64',media_type:pendingImageType||'image/jpeg',data:pendingImageBase64}});
  if(text) contentParts.push({type:'text',text});
  appendMessage('user', text, pendingImageBase64 ? `data:${pendingImageType};base64,${pendingImageBase64}` : null);
  inputEl.value = ''; inputEl.style.height='auto';
  // track if this message had a photo (for chess unlock)
  lastMessageHadImage = contentParts.some(p => p.type === 'image');
  // decide message format based on contentParts itself (BEFORE clearUpload resets pendingImageBase64)
  const isSingleTextOnly = contentParts.length === 1 && contentParts[0].type === 'text';
  conversationHistory.push({role:'user', content: isSingleTextOnly ? text : contentParts});
  clearUpload(); clearQuickReplies();
  callClaude(null, false, false);
}

async function callClaude(content, isSystem, expectJSON) {
  isLoading = true; sendBtn.disabled = true;
  if(isSystem) conversationHistory.push({role:'user', content});
  const typingEl = appendTyping();
  try {
    const res = await fetch(WEBHOOK_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({system_prompt: SYSTEM_PROMPT, messages: conversationHistory})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    const reply = data.content.map(b=>b.text||'').join('');
    conversationHistory.push({role:'assistant', content:reply});
    typingEl.remove();

    if (expectJSON) {
      const mission = parseMissionJSON(reply);
      if (mission) {
        if (mission.intro) appendMessage('coach', mission.intro);
        appendMissionCard(mission);
        if (mission.closing) appendMessage('coach', mission.closing);
      } else {
        appendMessage('coach', reply); // fallback if JSON parse fails
      }
    } else {
      appendMessage('coach', cleanMarkdown(reply));
    }
    setQuickReplies();
    // Следи снимки с обратна връзка (трябват PHOTOS_REQUIRED за unlock)
    if (lastMessageHadImage) {
      lastMessageHadImage = false;
      if (!chessUnlocked) {
        photoReviewCount++;
        if (photoReviewCount >= PHOTOS_REQUIRED) {
          chessUnlocked = true;
          updateChessButtons(true);
          appendMessage('coach', '🏆 Качи всичките — шахматната партия е отключена! Намери я в края на мисията.');
        } else {
          updateChessButtons(false); // update progress indicator
        }
      }
    }
  } catch(err) {
    typingEl.remove();
    appendMessage('coach', `⚠️ Грешка: ${err.message}`);
  }
  isLoading = false; sendBtn.disabled = false;
}

function parseMissionJSON(raw) {
  let s = raw.trim();
  // strip ```json ... ``` fences if present
  s = s.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '');
  // extract from first { to last }
  const start = s.indexOf('{');
  const end = s.lastIndexOf('}');
  if (start === -1 || end === -1) return null;
  s = s.slice(start, end + 1);
  try { return JSON.parse(s); }
  catch(e) { console.error('JSON parse failed:', e, s.slice(0,300)); return null; }
}

function cleanMarkdown(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/^#{1,3}\s+/gm, '')
    .replace(/^---+$/gm, '')
    .trim();
}

      <button class="tab bel" data-tab="bel">
        <span class="tab-icon"><i class="ti ti-pencil" aria-hidden="true"></i><span class="seen-check">✅</span></span>
        <span class="tab-label">БЕЛ</span>
        <span class="tab-count">${(mission.bel||[]).length}</span>
      </button>
      <button class="tab lit" data-tab="lit">
        <span class="tab-icon"><i class="ti ti-book-2" aria-hidden="true"></i><span class="seen-check">✅</span></span>
        <span class="tab-label">ЛИТ</span>
        <span class="tab-count">${(mission.lit&&mission.lit.questions||[]).length}</span>
      </button>
    </div>
    <div class="tab-panel mat" data-panel="mat"><div class="section-tag"><i class="ti ti-ruler" aria-hidden="true"></i> Математика</div></div>
    <div class="tab-panel bel" data-panel="bel"><div class="section-tag"><i class="ti ti-pencil" aria-hidden="true"></i> Български</div></div>
    <div class="tab-panel lit" data-panel="lit"><div class="section-tag"><i class="ti ti-book-2" aria-hidden="true"></i> Литература</div></div>
    <div class="mission-footer">
      <div class="mission-footer-photo">📷 Качи снимка с решението до 17:00ч</div>
      <div class="chess-reward locked" id="chess-reward-main">
        <div class="chess-reward-inner">
          <span class="chess-reward-icon">♟️</span>
          <div class="chess-reward-text">
            <div class="chess-reward-title">Шахматна партия с Компас</div>
            <div class="chess-reward-sub">Качи решението → отключва се достъпът</div>
          </div>
        </div>
      </div>
    </div>
  `;


  // Populate MAT panel
  const matPanel = card.querySelector('.tab-panel[data-panel="mat"]');
  (mission.mat||[]).forEach((task, i) => {
    const row = document.createElement('div');
    row.className = 'task-row mat';
    row.style.setProperty('--task-i', i);
    row.innerHTML = `<div class="task-badge">${i+1}</div><div class="task-text"></div>`;
    row.querySelector('.task-text').textContent = task;
    matPanel.appendChild(row);
  });

  // Populate BEL panel
  const belPanel = card.querySelector('.tab-panel[data-panel="bel"]');
  (mission.bel||[]).forEach((task, i) => {
    const row = document.createElement('div');
    row.className = 'task-row bel';
    row.style.setProperty('--task-i', i);
    row.innerHTML = `<div class="task-badge">${i+1}</div><div class="task-text"></div>`;
    row.querySelector('.task-text').textContent = task;
    belPanel.appendChild(row);
  });

  // Populate LIT panel
  const litPanel = card.querySelector('.tab-panel[data-panel="lit"]');
  if (mission.lit) {
    const litCard = document.createElement('div');
    litCard.className = 'lit-card';
    litCard.innerHTML = `
      <div class="lit-card-top">
        <div class="lit-icon">📜</div>
        <div>
          <div class="lit-work"></div>
          <div class="lit-author"></div>
        </div>
      </div>
      <div class="lit-time">⏱ ${mission.lit.time_estimate || ''}</div>
    `;
    litCard.querySelector('.lit-work').textContent = mission.lit.work || '';
    litCard.querySelector('.lit-author').textContent = mission.lit.author || '';
    litPanel.appendChild(litCard);

    const qWrap = document.createElement('div');
    qWrap.className = 'lit-questions';
    (mission.lit.questions||[]).forEach((q, i) => {
      const row = document.createElement('div');
      row.className = 'task-row lit';
      row.style.setProperty('--task-i', i);
      row.innerHTML = `<div class="task-badge">${i+1}</div><div class="task-text"></div>`;
      row.querySelector('.task-text').textContent = q;
      qWrap.appendChild(row);
    });
    litPanel.appendChild(qWrap);
  }

  // Tab click → smooth scroll to that section (all sections always visible)
  card.querySelectorAll('.tab').forEach(tabBtn => {
    tabBtn.addEventListener('click', () => {
      const panel = card.querySelector(`.tab-panel[data-panel="${tabBtn.dataset.tab}"]`);
      // Pause observer during manual navigation
      observerActive = false;
      // Set active tab immediately
      card.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tabBtn));
      panel.scrollIntoView({ behavior:'smooth', block:'start' });
      // Re-enable observer after scroll settles
      setTimeout(() => { observerActive = true; }, 900);
    });
  });

  // Track which sections have been scrolled past → mark tab as seen
  // Delay observer activation so initial render doesn't trigger false positives
  let observerActive = false;
  setTimeout(() => { observerActive = true; }, 800);

  const observer = new IntersectionObserver((entries) => {
    if (!observerActive) return;
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const name = entry.target.dataset.panel;
        const tab = card.querySelector(`.tab[data-tab="${name}"]`);
        tab.classList.add('seen');
        card.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t===tab));
      }
    });
  }, { root: null, threshold: 0.6 });
  card.querySelectorAll('.tab-panel').forEach(p => observer.observe(p));

  messagesEl.appendChild(card);
  updateChessButtons();

  // Set MAT as active tab immediately
  card.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'mat'));

  // Scroll to MAT section — only when NOT called from requestMission (which handles scroll itself)
  if (!skipScroll) {
    setTimeout(() => {
      const matPanel = card.querySelector('.tab-panel[data-panel="mat"]');
      if (matPanel) matPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      else card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }

  if (window.renderMathInElement) {
    renderMathInElement(card, {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
}

// ── UI helpers ──
// appendRichMessage — same as appendMessage but uses innerHTML (for Tabler icons in text)
function appendRichMessage(role, html, imgSrc, extraClass) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = extraClass ? `bubble ${extraClass}` : 'bubble';
  if(html) bubble.innerHTML = html;
  if(imgSrc) { const img=document.createElement('img'); img.src=imgSrc; bubble.appendChild(img); }
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = new Date().toLocaleTimeString('bg-BG',{hour:'2-digit',minute:'2-digit'});
  div.appendChild(bubble); div.appendChild(meta);
  messagesEl.appendChild(div);
  return div;
}

function appendMessage(role, text, imgSrc) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if(text) {
    bubble.textContent = text;
    if(window.renderMathInElement) {
      renderMathInElement(bubble, {
        delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],
        throwOnError:false
      });
    }
  }
  if(imgSrc) { const img=document.createElement('img'); img.src=imgSrc; bubble.appendChild(img); }
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = new Date().toLocaleTimeString('bg-BG',{hour:'2-digit',minute:'2-digit'});
  div.appendChild(bubble); div.appendChild(meta);
  messagesEl.appendChild(div);
  window.scrollTo({top: document.body.scrollHeight, behavior: "smooth"});
  return div;
}

function appendTyping() {
  const div = document.createElement('div');
  div.className = 'msg coach';
  div.innerHTML = `<div class="typing-bubble"><span></span><span></span><span></span></div>`;
  messagesEl.appendChild(div);
  window.scrollTo({top: document.body.scrollHeight, behavior: "smooth"});
  return div;
}

function addDayLabel(text) {
  const div = document.createElement('div');
  div.className = 'day-label';
  div.textContent = text;
  messagesEl.appendChild(div);
  lastDayLabel = div;
  return div;
}

function setQuickReplies() {
  quickRepliesEl.innerHTML = '';
  if (chessUnlocked) {
    const btn = document.createElement('button');
    btn.className = 'qr'; btn.textContent = '♟️ Играй шах';
    btn.addEventListener('click', () => openChess());
    quickRepliesEl.appendChild(btn);
  }
}

function clearQuickReplies() { quickRepliesEl.innerHTML = ''; }

// ══════════════════════════════════════════════
// ── CHESS GAME ──
// ══════════════════════════════════════════════
let chess = null;
let selectedSq = null;
let validMoves = [];
let chessThinking = false;
let chessUnlocked = false;
let photoReviewCount = 0;      // брой снимки с обратна връзка (трябват 3 за unlock)
const PHOTOS_REQUIRED = 3;     // по 1 на секция: МАТ, БЕЛ, ЛИТ
let lastMessageHadImage = false;
let lastDayLabel = null;

const PIECE_GLYPHS = {
  wK:'♔', wQ:'♕', wR:'♖', wB:'♗', wN:'♘', wP:'♙',
  bK:'♚', bQ:'♛', bR:'♜', bB:'♝', bN:'♞', bP:'♟'
};

const KOMPAS_FLAVOR = [
  'Хм, интересен ход...', 'Виждам плана ти 😏', 'Добре обмислено.',
  'Трябва да внимавам.', 'Не лошо, не лошо.', 'Сериозен си!',
  'Ок, мой ред.', '🤔 Нека помисля...', 'Учиш бързо!',
];

const chessOverlay = document.getElementById('chess-overlay');
const chessBoardEl = document.getElementById('chess-board');
const chessStatusEl = document.getElementById('chess-status');
const chessTurnEl = document.getElementById('chess-turn');
const chessResultEl = document.getElementById('chess-result');
const chessCloseBtn = document.getElementById('chess-close-btn');
const chessNewBtn = document.getElementById('chess-new-btn');

chessCloseBtn.addEventListener('click', () => chessOverlay.classList.remove('visible'));
chessNewBtn.addEventListener('click', initChessGame);
chessOverlay.addEventListener('click', e => {
  if(e.target === chessOverlay) chessOverlay.classList.remove('visible');
});

function openChess() {
  if (!chessUnlocked) return;
  chessOverlay.classList.add('visible');
  if (!chess) initChessGame();
}

function updateChessButtons(isNewUnlock) {
  // Show/hide floating button
  const floatBtn = document.getElementById('chess-float-btn');
  if (floatBtn) floatBtn.classList.toggle('visible', chessUnlocked);

  document.querySelectorAll('.chess-reward').forEach(card => {
    if (chessUnlocked) {
      card.className = 'chess-reward unlocked' + (isNewUnlock ? ' just-unlocked' : '');
      // Rebuild inner with play button
      card.innerHTML = `
        <div class="chess-reward-inner">
          <span class="chess-reward-icon">♟️</span>
          <div class="chess-reward-text">
            <div class="chess-reward-title">Шахматна партия с Компас</div>
            <div class="chess-reward-sub">Готово за игра! 🏆</div>
          </div>
          <button class="chess-play-btn" onclick="openChess()">Играй →</button>
        </div>`;
      if (isNewUnlock) {
        setTimeout(() => card.classList.remove('just-unlocked'), 1500);
      }
    } else {
      card.className = 'chess-reward locked';
      const remaining = PHOTOS_REQUIRED - photoReviewCount;
      const progress = photoReviewCount > 0
        ? `📷 ${photoReviewCount}/${PHOTOS_REQUIRED} снимки качени`
        : `Качи снимки с решенията, за да отключиш`;
      card.innerHTML = `
        <div class="chess-reward-inner">
          <span class="chess-reward-icon">♟️</span>
          <div class="chess-reward-text">
            <div class="chess-reward-title">Шахматна партия с Компас</div>
            <div class="chess-reward-sub">${progress} — нужни: ${PHOTOS_REQUIRED}</div>
          </div>
          <div class="chess-progress-pills">
            ${Array.from({length: PHOTOS_REQUIRED}, (_, i) =>
              `<span class="chess-pip ${i < photoReviewCount ? 'done' : ''}"></span>`
            ).join('')}
          </div>
        </div>`;
    }
  });
}

function initChessGame() {
  chess = new Chess();
  selectedSq = null;
  validMoves = [];
  chessThinking = false;
  chessResultEl.style.display = 'none';
  chessStatusEl.textContent = 'Ти си Бели ♔ — направи първия ход!';
  chessStatusEl.className = 'chess-status';
  renderChessBoard();
  updateTurnIndicator();
}

function renderChessBoard() {
  chessBoardEl.innerHTML = '';
  const board = chess.board(); // 8x8 array, rank 8 first
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = String.fromCharCode(97+f) + (8-r); // e.g. 'e4'
      const cell = board[r][f];
      const isLight = (r + f) % 2 === 0;
      const div = document.createElement('div');
      div.className = 'sq ' + (isLight ? 'light' : 'dark');
      div.dataset.sq = sq;

      if (selectedSq === sq) div.classList.add('selected');
      if (validMoves.includes(sq)) {
        div.classList.add(cell ? 'valid-capture' : 'valid-move');
      }
      if (cell) div.textContent = PIECE_GLYPHS[cell.color + cell.type.toUpperCase()] || '';

      div.addEventListener('click', () => handleChessClick(sq));
      chessBoardEl.appendChild(div);
    }
  }
}

function handleChessClick(sq) {
  if (chess.game_over() || chessThinking || chess.turn() !== 'w') return;

  const piece = chess.get(sq);

  if (selectedSq) {
    // Try to make move
    if (validMoves.includes(sq)) {
      // Check pawn promotion
      let move = { from: selectedSq, to: sq };
      const p = chess.get(selectedSq);
      if (p && p.type === 'p' && (sq[1] === '8' || sq[1] === '1')) move.promotion = 'q';

      const result = chess.move(move);
      if (result) {
        selectedSq = null; validMoves = [];
        renderChessBoard();
        if (chess.game_over()) { handleChessEnd(); return; }
        chessThinking = true;
        chessStatusEl.textContent = KOMPAS_FLAVOR[Math.floor(Math.random()*KOMPAS_FLAVOR.length)];
        chessStatusEl.className = 'chess-status thinking';
        updateTurnIndicator();
        setTimeout(() => getKompasMove(), 800);
        return;
      }
    }
    // Deselect or select new piece
    selectedSq = null; validMoves = [];
    if (piece && piece.color === 'w') {
      selectedSq = sq;
      validMoves = chess.moves({square: sq, verbose: true}).map(m => m.to);
    }
  } else {
    if (piece && piece.color === 'w') {
      selectedSq = sq;
      validMoves = chess.moves({square: sq, verbose: true}).map(m => m.to);
    }
  }
  renderChessBoard();
}

async function getKompasMove() {
  const allMoves = chess.moves();
  if (!allMoves.length) { handleChessEnd(); return; }

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        system_prompt: `Ти играеш шах на ниво ~1300 ELO. Правиш предимно добри ходове, но понякога допускаш малки грешки, за да може опонентът (12-годишно момче) да има реален шанс да спечели. Отговаряй САМО с един ход в SAN нотация, нищо друго.`,
        messages: [{
          role: 'user',
          content: `FEN: ${chess.fen()}\nВалидни ходове: ${allMoves.join(', ')}\nИзбери един ход за Черни.`
        }]
      })
    });
    const data = await res.json();
    const rawMove = (data.content?.[0]?.text || '').trim().replace(/[.!?]/g,'').split(' ')[0];

    // Validate the move is in allMoves list
    const move = allMoves.find(m => m === rawMove) || allMoves[Math.floor(Math.random()*allMoves.length)];
    chess.move(move);
  } catch(e) {
    // Fallback to random move
    const moves = chess.moves();
    if (moves.length) chess.move(moves[Math.floor(Math.random()*moves.length)]);
  }

  chessThinking = false;
  selectedSq = null; validMoves = [];
  renderChessBoard();
  updateTurnIndicator();

  if (chess.game_over()) { handleChessEnd(); return; }

  if (chess.in_check()) {
    chessStatusEl.textContent = '⚠️ Шах! Защити краля.';
  } else {
    chessStatusEl.textContent = 'Твой ред — Бели ♔';
  }
  chessStatusEl.className = 'chess-status';
}

function updateTurnIndicator() {
  chessTurnEl.textContent = chess.turn() === 'w' ? 'На ход: ⬜ Бели (ти)' : 'На ход: ⬛ Черни (Компас)';
}

function handleChessEnd() {
  chessResultEl.style.display = 'block';
  if (chess.in_checkmate()) {
    if (chess.turn() === 'b') {
      chessResultEl.textContent = '🏆 Спечели! Мат на Компас!';
      chessResultEl.className = 'chess-result win';
      chessStatusEl.textContent = 'Честито! Сигурно си учил добре 😄';
    } else {
      chessResultEl.textContent = '♟️ Компас спечели. Пробвай пак!';
      chessResultEl.className = 'chess-result lose';
      chessStatusEl.textContent = 'Следващия път ще е по-трудно да ме победиш 😏';
    }
  } else if (chess.in_draw()) {
    chessResultEl.textContent = '🤝 Реми!';
    chessResultEl.className = 'chess-result draw';
    chessStatusEl.textContent = 'Добра игра и от двете страни.';
  }
  chessStatusEl.className = 'chess-status';
}
</script>
