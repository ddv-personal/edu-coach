<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Компас</title>
<script>
// Мобилните браузъри променят реалната видима височина при показване/скриване на
// адресната лента — height:100% не го отчита и бута input полето извън екрана.
// Тук пресмятаме реалната височина в JS и я подаваме като CSS променлива.
function setRealVH() {
  document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
}
setRealVH();
window.addEventListener('resize', setRealVH);
window.addEventListener('orientationchange', setRealVH);
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0d1117;
  --surface:   #13181f;
  --card:      #181e27;
  --border:    #1f2837;
  --mat:       #4facfe;
  --mat-soft:  rgba(79,172,254,0.10);
  --mat-glow:  rgba(79,172,254,0.30);
  --bel:       #f7b731;
  --bel-soft:  rgba(247,183,49,0.10);
  --bel-glow:  rgba(247,183,49,0.28);
  --lit:       #a78bfa;
  --lit-soft:  rgba(167,139,250,0.10);
  --lit-glow:  rgba(167,139,250,0.30);
  --user-bg:   #1a2235;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --radius:    16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:calc(var(--vh, 1vh) * 100);overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;display:flex;flex-direction:column}

/* Setup screen CSS removed */

/* ── HEADER ── */
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;z-index:20}
.h-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--mat),var(--lit));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;box-shadow:0 0 14px rgba(167,139,250,.3)}
.h-info{flex:1;min-width:0}
.h-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;letter-spacing:-.01em}

.h-btn{flex-shrink:0;background:none;border:1.5px solid transparent;border-radius:20px;font-size:12px;padding:6px 12px;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:'Inter',sans-serif}
.h-btn:hover{border-color:var(--lit);color:var(--lit)}
.h-btn-icon{padding:6px 10px}

/* ── MESSAGES ── */
#main-pane{flex:1;overflow-y:auto;min-height:0;padding:0;display:flex;flex-direction:column;gap:0}

/* ── SCROLL HINT — показва се, когато има скрито съдържание под екрана (напр. заключената шах карта) ── */
#scroll-hint{position:sticky;bottom:10px;z-index:40;display:none;justify-content:center;pointer-events:none}
#scroll-hint.visible{display:flex}
#scroll-hint span{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.25);animation:scrollHintBob 1.6s ease-in-out infinite}
#scroll-hint i{font-size:13px}
@keyframes scrollHintBob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
#main-pane::-webkit-scrollbar{width:3px}
#main-pane::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.main-view{width:100%}

/* ── CHAT AS OVERLAY (вместо постоянно заемащ 1/3 от екрана) ── */
#chat-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:150;display:none;align-items:flex-end;justify-content:center}
#chat-overlay.visible{display:flex}
@media(min-width:600px){ #chat-overlay{align-items:center;justify-content:center} }
#chat-pane{width:100%;max-width:480px;height:82vh;max-height:82vh;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideUp .35s cubic-bezier(0.34,1.56,0.64,1) both;border:1px solid var(--border);border-bottom:none;min-height:0}
@media(min-width:600px){ #chat-pane{border-radius:20px;border-bottom:1px solid var(--border);height:78vh;max-height:78vh} }
#chat-pane-label{font-size:11px;font-weight:600;color:var(--muted);padding:14px 14px 8px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:5px;background:var(--surface);border-radius:20px 20px 0 0}
#chat-pane-label .cp-close{margin-left:auto;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
#messages{flex:1;overflow-y:auto;padding:8px 14px 4px;display:flex;flex-direction:column;gap:10px;min-height:0}

/* ── FLOATING CHAT BUBBLE ── */
#chat-float-btn{position:fixed;bottom:22px;right:16px;z-index:60;background:linear-gradient(135deg,var(--lit),#8b6cf1);border:none;border-radius:50%;width:56px;height:56px;font-size:24px;cursor:pointer;box-shadow:0 4px 18px rgba(167,139,250,.45);transition:all .2s;display:flex;align-items:center;justify-content:center}
#chat-float-btn:hover{transform:scale(1.08)}
#chat-float-btn:active{transform:scale(0.9);transition:transform .07s ease}
#chat-float-btn .cfb-badge{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#ef4444;border:2px solid var(--bg);display:none}
#chat-float-btn.has-badge .cfb-badge{display:block;animation:float-in .3s cubic-bezier(.34,1.56,.64,1) both}
#chat-float-btn.hidden-while-open{display:none}

/* ── НА ПО-ГОЛЕМИ ЕКРАНИ: чатът стои постоянно долу (има място), не зад балонче ── */
#resize-handle{display:none;height:14px;cursor:row-resize;align-items:center;justify-content:center;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;touch-action:none}
#resize-handle .rh-grip{width:36px;height:4px;border-radius:2px;background:var(--border);transition:background .15s}
#resize-handle:hover .rh-grip,#resize-handle.dragging .rh-grip{background:var(--lit)}
@media(min-width:860px){
  #chat-float-btn{display:none !important}
  #resize-handle{display:flex}
  #chat-overlay{position:static !important;background:none !important;display:flex !important;inset:auto;flex:0 0 auto;height:170px;min-height:120px;max-height:75vh;align-items:stretch;justify-content:stretch}
  #chat-pane{width:100%;max-width:none;height:100%;max-height:none;border-radius:0;border:none;animation:none}
  #chat-pane-label{border-radius:0}
  #chat-pane-label .cp-close{display:none}

  /* Компактно оформление — на широк екран чатът вече взима реално място,
     "дишащото" оформление за мобилно (повече padding/по-едри икони) тук би
     изяло твърде много и не би се събрало без скрол. */
  .module-list{padding:6px 14px 8px;gap:0}
  .ml-card{padding:9px 14px;gap:9px}
  .ml-icon,.ml-icon i{font-size:19px}
  .ml-name{font-size:14px}
  .ml-meta{font-size:11px;margin-top:1px}
  .ml-line{height:6px}
}
#messages::-webkit-scrollbar{width:3px}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.day-label{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:4px 0}

/* ── MISSION CARD WITH TABS ── */
.mission-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);animation:springUp .45s cubic-bezier(0.34,1.56,0.64,1) both}
.tabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:63px;background:var(--card);z-index:5;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 6px 9px;cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif;position:relative;transition:background .15s}
.tab .tab-icon{font-size:0;position:relative;line-height:1}.tab .tab-icon i{font-size:21px;color:var(--muted)}.tab[data-tab="mat"].active .tab-icon i{color:var(--mat)}.tab[data-tab="bel"].active .tab-icon i{color:var(--bel)}.tab[data-tab="lit"].active .tab-icon i{color:var(--lit)}.tab[data-tab="mat"]:not(.active) .tab-icon i{color:var(--mat);opacity:0.45}.tab[data-tab="bel"]:not(.active) .tab-icon i{color:var(--bel);opacity:0.45}.tab[data-tab="lit"]:not(.active) .tab-icon i{color:var(--lit);opacity:0.45}
.tab .tab-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tab .tab-count{font-size:14px;font-weight:700;color:var(--muted);font-family:'Space Grotesk',sans-serif;line-height:1;opacity:1}.tab[data-tab="mat"].active .tab-count{color:var(--mat)}.tab[data-tab="bel"].active .tab-count{color:var(--bel)}.tab[data-tab="lit"].active .tab-count{color:var(--lit)}
.tab.active .tab-label{color:var(--text)}
.tab .seen-check{display:none;position:absolute;top:-3px;right:-9px;font-size:10px}
.tab.seen .seen-check{display:inline}
.tab::after{content:'';position:absolute;bottom:0;left:12%;right:12%;height:2px;border-radius:2px;background:transparent;transition:background .2s}
.tab[data-tab="mat"].active::after{background:var(--mat)}
.tab[data-tab="bel"].active::after{background:var(--bel)}
.tab[data-tab="lit"].active::after{background:var(--lit)}
.tab[data-tab="mat"].active{background:var(--mat-soft)}
.tab[data-tab="bel"].active{background:var(--bel-soft)}
.tab[data-tab="lit"].active{background:var(--lit-soft)}
.tab:hover:not(.active){background:rgba(255,255,255,0.02)}

.tab-panel{padding:16px;scroll-margin-top:115px}
.tab-panel + .tab-panel{border-top:1px solid var(--border)}
.section-tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.tab-panel.mat .section-tag{color:var(--mat)}.tab-panel.mat .section-tag i{font-size:18px;color:var(--mat)}
.tab-panel.bel .section-tag{color:var(--bel)}.tab-panel.bel .section-tag i{font-size:18px;color:var(--bel)}
.tab-panel.lit .section-tag{color:var(--lit)}.tab-panel.lit .section-tag i{font-size:18px;color:var(--lit)}

.task-row{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.task-row:last-child{border-bottom:none}
.task-badge{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:'Space Grotesk',sans-serif;margin-top:1px;transition:all .25s cubic-bezier(0.34,1.56,0.64,1)}
.task-row.mat .task-badge{background:var(--mat-soft);color:var(--mat);border:1px solid rgba(79,172,254,0.35)}
.task-row.bel .task-badge{background:var(--bel-soft);color:var(--bel);border:1px solid rgba(247,183,49,0.35)}
/* Задача, потвърдена вярна от Компас — зелена отметка вместо номер */
.task-badge .tb-check{display:none}
.task-row.task-done .task-badge{background:rgba(74,222,128,0.18);color:#4ade80;border-color:rgba(74,222,128,0.4);transform:scale(1.05)}
.task-row.task-done .task-badge .tb-num{display:none}
.task-row.task-done .task-badge .tb-check{display:block}
.task-row.task-done .task-text{opacity:.6}
.task-text{flex:1;font-size:16px;line-height:1.65;color:var(--text);padding-top:1px}

/* lit panel special layout */
.lit-card{background:var(--lit-soft);border:1px solid rgba(167,139,250,0.25);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.lit-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.lit-icon{font-size:22px;flex-shrink:0}
.lit-work{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--lit)}
.lit-author{font-size:12px;color:var(--muted);margin-top:1px}
.lit-time{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--lit);background:rgba(167,139,250,0.15);border-radius:10px;padding:2px 9px;margin-top:8px}
.lit-poem{font-style:italic;font-size:13.5px;line-height:1.7;color:#cbd5e1;border-left:2px solid rgba(167,139,250,0.4);padding-left:12px;margin-top:10px;white-space:pre-wrap}
.lit-questions{display:flex;flex-direction:column;gap:0}
.task-row.lit .task-badge{background:var(--lit-soft);color:var(--lit);border:1px solid rgba(167,139,250,0.35)}

.mission-footer{padding:12px 16px 0;border-top:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);display:flex;flex-direction:column;gap:10px}
.mission-footer-photo{font-size:11.5px;color:var(--muted);padding-bottom:12px}
.chess-reward{border-radius:12px;overflow:hidden;transition:all .3s}
.chess-reward.locked{background:rgba(255,255,255,0.03);border:1px dashed var(--border)}
.chess-reward.unlocked{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.35);box-shadow:0 0 16px rgba(251,191,36,0.1)}
.chess-reward-inner{display:flex;align-items:center;gap:10px;padding:10px 14px}
.chess-reward-icon{font-size:20px;flex-shrink:0;transition:filter .3s}
.chess-reward.locked .chess-reward-icon{filter:grayscale(1);opacity:0.4}
.chess-reward-text{flex:1;min-width:0}
.chess-reward-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.chess-reward.locked .chess-reward-title{color:var(--muted)}
.chess-reward-sub{font-size:11px;color:var(--muted);line-height:1.4}
.chess-reward.unlocked .chess-reward-sub{color:rgba(251,191,36,0.8)}
.chess-play-btn{flex-shrink:0;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:10px;color:#1a1000;font-size:12px;font-weight:700;padding:8px 14px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .18s;white-space:nowrap}
.chess-play-btn:hover{transform:scale(1.05);box-shadow:0 0 14px rgba(251,191,36,0.5)}
@keyframes unlock-pulse{0%{box-shadow:0 0 0 0 rgba(251,191,36,0.5)}70%{box-shadow:0 0 0 10px rgba(251,191,36,0)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}}
.chess-reward.just-unlocked{animation:unlock-pulse 0.6s ease 2}
.chess-progress-pills{display:flex;gap:4px;flex-shrink:0}
.chess-pip{width:10px;height:10px;border-radius:50%;background:var(--border);transition:background .3s}
.chess-pip.done{background:#fbbf24}
/* ── FLOATING CHESS BUTTON (появява се след unlock) ── */
#chess-float-btn{position:fixed;bottom:90px;right:16px;z-index:25;background:linear-gradient(135deg,#fbbf24,#f59e0b);border:none;border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(251,191,36,0.45);transition:all .2s;display:none;align-items:center;justify-content:center}
#chess-float-btn.visible{display:flex}
#chess-float-btn:hover{transform:scale(1.1);box-shadow:0 6px 22px rgba(251,191,36,0.6)}
@keyframes float-in{from{opacity:0;transform:scale(0.5) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
#chess-float-btn.visible{animation:float-in .3s cubic-bezier(.34,1.56,.64,1) both}

/* ── CHAT BUBBLES ── */
.msg{display:flex;flex-direction:column;max-width:82%;gap:3px;animation:springUp .3s cubic-bezier(0.34,1.56,0.64,1) both}
.msg.coach{align-self:flex-start}
.msg.user{align-self:flex-end}
.bubble{padding:11px 15px;border-radius:var(--radius);line-height:1.65;white-space:pre-wrap;word-break:break-word;font-size:16px}
.coach .bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:6px}.bubble.featured{border-left:3px solid var(--lit);background:rgba(167,139,250,0.06);}
.user .bubble{background:var(--user-bg);border:1px solid #243051;border-bottom-right-radius:6px;color:#c8d8ff}
.msg-meta{font-size:10px;color:var(--muted);padding:0 4px}
.coach .msg-meta{text-align:left}
.user .msg-meta{text-align:right}
.bubble img{max-width:220px;border-radius:10px;margin-top:8px;display:block}

.typing-bubble{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);border-bottom-left-radius:6px;padding:14px 18px;display:flex;gap:5px;align-items:center}
.typing-bubble span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.typing-bubble span:nth-child(2){animation-delay:.2s}
.typing-bubble span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes springUp{0%{opacity:0;transform:translateY(14px) scale(0.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slideInTask{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes compassSpin{from{transform:rotate(-25deg) scale(0.85)}to{transform:rotate(0deg) scale(1)}}

/* ── QUICK REPLIES ── */
#footer-area{background:var(--surface);flex-shrink:0}
#quick-replies{display:flex;gap:7px;padding:8px 14px 8px;overflow-x:auto}
#quick-replies:empty{padding:0}
#quick-replies::-webkit-scrollbar{display:none}
.qr{flex-shrink:0;font-size:12.5px;padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .18s;white-space:nowrap;font-family:'Inter',sans-serif}
.qr:hover{border-color:var(--lit);color:var(--lit);background:var(--lit-soft)}

/* ── ACK BUTTON (потвърждение на разбиране преди 'you are done') ── */
.ack-wrap{align-self:flex-start;max-width:82%;margin-top:2px;animation:springUp .3s cubic-bezier(0.34,1.56,0.64,1) both}
.ack-btn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--lit),#8b6cf1);border:none;border-radius:20px;color:#fff;font-size:13.5px;font-weight:700;padding:9px 18px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .18s;box-shadow:0 0 14px rgba(167,139,250,.25)}
.ack-btn:hover{transform:scale(1.04);box-shadow:0 0 20px rgba(167,139,250,.4)}
.ack-btn:disabled{opacity:.5;cursor:default;transform:none}
.ack-done-banner{align-self:center;display:flex;align-items:center;gap:6px;background:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.35);color:#4ade80;font-size:13px;font-weight:700;padding:8px 16px;border-radius:20px;margin-top:4px;animation:springUp .3s cubic-bezier(0.34,1.56,0.64,1) both}
.ack-done-banner i{font-size:16px}

/* ── UPLOAD PREVIEW ── */
#upload-preview{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-top:1px solid var(--border)}
#upload-preview.visible{display:flex}
#preview-img{height:44px;border-radius:8px;object-fit:cover}
#preview-name{font-size:12px;color:var(--muted);flex:1}
#remove-upload{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}

/* ── INPUT ── */
#input-area{display:flex;align-items:flex-end;gap:9px;padding:10px 14px 14px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
#user-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text);font-family:'Inter',sans-serif;font-size:16px;padding:10px 16px;resize:none;outline:none;max-height:130px;overflow-y:auto;line-height:1.4;transition:border-color .2s}
#user-input::placeholder{color:var(--muted)}
#user-input:focus{border-color:var(--lit)}
#upload-btn{width:36px;height:36px;border-radius:50%;background:none;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);transition:all .2s}
#upload-btn:hover{border-color:var(--mat);color:var(--mat)}
#file-input{display:none}
#send-btn{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--mat),var(--lit));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;box-shadow:0 0 12px var(--lit-glow)}
#send-btn:hover{transform:scale(1.08);box-shadow:0 0 20px var(--lit-glow)}
#send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
/* ── PROGRESS / ARCHIVE OVERLAY ── */
#progress-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:150;display:none;align-items:flex-end;justify-content:center}
#progress-overlay.visible{display:flex}
.po-panel{width:100%;max-width:480px;max-height:88vh;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideUp .35s cubic-bezier(0.34,1.56,0.64,1) both;border:1px solid var(--border);border-bottom:none}
@media(min-width:600px){
  #progress-overlay{align-items:center;justify-content:center}
  .po-panel{border-radius:20px;border-bottom:1px solid var(--border);max-height:80vh}
}
@keyframes slideUp{from{transform:translateY(40px) scale(0.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.po-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;flex-shrink:0}
.po-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}
.po-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}
.po-tabs{display:flex;gap:6px;padding:0 14px 12px;flex-shrink:0}
.po-tab{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--muted);font-size:12px;font-weight:600;padding:9px 6px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.po-tab.active{background:var(--lit-soft);border-color:rgba(167,139,250,0.4);color:var(--lit)}
.po-body{flex:1;overflow-y:auto;padding:4px 18px 24px}
.po-body::-webkit-scrollbar{width:3px}
.po-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.po-note{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin-bottom:14px;line-height:1.5}

/* history list */
.hist-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.hist-card:hover{border-color:rgba(167,139,250,0.35)}
.hist-top{display:flex;align-items:center;justify-content:space-between}
.hist-date{font-size:12px;color:var(--muted)}
.hist-theme{font-size:11px;color:var(--lit);display:flex;align-items:center;gap:4px}
.hist-summary{font-size:13px;color:var(--text);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.hist-pill{font-size:11px;padding:2px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:3px}
.hist-pill.mat{background:var(--mat-soft);color:var(--mat)}
.hist-pill.bel{background:var(--bel-soft);color:var(--bel)}
.hist-pill.lit{background:var(--lit-soft);color:var(--lit)}
.hist-pill.pill-untouched{opacity:.4;filter:grayscale(0.6)}
.hist-pill.pill-done i{font-size:11px}

/* Разгъващи се детайли за деня — задачи + бележки за наблюдения */
.hist-toggle{font-size:11px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:3px;cursor:pointer}
.hist-toggle:hover{color:var(--lit)}
.hist-toggle i{font-size:12px;transition:transform .15s}
.hist-toggle.expanded i{transform:rotate(180deg)}
.hist-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.6}
.hist-detail.visible{display:block}
.hist-detail-group{margin-bottom:8px}
.hist-detail-group b{color:var(--text);font-weight:700}
.hist-detail-q{margin:2px 0 2px 10px}
.hist-detail-notes{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}

/* reading checklist */
.read-progress{font-size:12px;color:var(--muted);margin-bottom:12px}
.read-group-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.read-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.read-check{flex-shrink:0;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:1px}
.read-item.done .read-check{background:var(--lit);border-color:var(--lit);color:#fff}
.read-text{font-size:13px;line-height:1.4}
.read-item.done .read-text{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(100,116,139,0.4)}
.read-author{color:var(--muted);font-size:11.5px}

/* skills grid */
.skill-group-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}
.skill-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.skill-code{flex-shrink:0;width:30px;font-size:11px;font-weight:700;color:var(--muted);font-family:'Space Grotesk',sans-serif}
.skill-label{flex:1;font-size:12.5px;color:var(--text)}
.skill-dot{flex-shrink:0;width:9px;height:9px;border-radius:50%}
.skill-dot.good{background:var(--lit);box-shadow:0 0 6px var(--lit-glow)}
.skill-dot.some{background:var(--bel)}
.skill-dot.none{background:var(--border)}

/* ── MISSED DAY PROMPT ── */
.missed-day-choice{display:flex;gap:8px;max-width:100%}
.md-btn{flex:1;border-radius:14px;padding:11px 14px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .18s;border:1px solid transparent}
.md-btn.primary{background:linear-gradient(135deg,var(--mat),var(--lit));color:#fff;box-shadow:0 0 12px var(--lit-glow)}
.md-btn.primary:hover{opacity:.9;transform:translateY(-1px)}
.md-btn.secondary{background:var(--card);border-color:var(--border);color:var(--muted)}
.md-btn.secondary:hover{border-color:var(--lit);color:var(--lit)}
/* ── CHESS OVERLAY ── */
#chess-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:160;display:none;align-items:center;justify-content:center;padding:16px}
#chess-overlay.visible{display:flex}
.chess-panel{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:420px;max-height:95vh;overflow-y:auto;display:flex;flex-direction:column}
.chess-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.chess-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700}
.chess-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px}
.chess-status{padding:10px 16px;font-size:13px;color:var(--text);background:var(--surface);border-bottom:1px solid var(--border);min-height:44px;flex-shrink:0;line-height:1.5}
.chess-status.thinking{color:var(--muted);font-style:italic}
.chess-board-wrap{padding:12px;flex-shrink:0}
.chess-board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid var(--border)}
.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(22px,6vw,38px);cursor:pointer;position:relative;transition:background .1s;user-select:none}
.sq.light{background:#d4b896}
.sq.dark{background:#8b5e3c}
.sq.selected{background:#f0d060 !important}
.sq.valid-move::after{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,0.25)}
.sq.valid-capture::after{content:'';position:absolute;inset:0;border:3px solid rgba(0,0,0,0.3);border-radius:2px}
.sq:hover:not(.selected){opacity:0.85}
.chess-coords{display:flex;justify-content:space-around;padding:0 12px 4px;font-size:10px;color:var(--muted);font-family:monospace}
.chess-info{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);flex-shrink:0}
.chess-turn{font-size:12px;color:var(--muted)}
.chess-new-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:12px;padding:6px 12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.chess-new-btn:hover{border-color:var(--lit);color:var(--lit)}
.chess-result{text-align:center;padding:14px 16px;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;flex-shrink:0}
.chess-result.win{color:#4ade80}
.chess-result.lose{color:#fb7185}
.chess-result.draw{color:var(--muted)}
/* ── SPRING INTERACTIONS & TACTILE FEEDBACK ── */
/* Compass spin on load */
.h-avatar{animation:compassSpin .7s cubic-bezier(0.34,1.56,0.64,1) both}

/* Press states — tactile feedback on all interactive elements */
.tab:active{transform:scale(0.91);transition:transform .07s ease}
#send-btn:active{transform:scale(0.87) !important;transition:transform .07s ease}
.chess-play-btn:active{transform:scale(0.91) !important;transition:transform .07s ease}
.md-btn:active{transform:scale(0.95) !important;transition:transform .07s ease}
.h-btn:active{transform:scale(0.93);transition:transform .07s ease}
.qr:active{transform:scale(0.93);transition:transform .07s ease}
#upload-btn:active{transform:scale(0.89);transition:transform .07s ease}
#chess-float-btn:active{transform:scale(0.88) !important;transition:transform .07s ease}
.hist-card:active{transform:scale(0.98);transition:transform .1s ease}

/* Staggered task rows */
.task-row{animation:slideInTask .3s cubic-bezier(0.34,1.56,0.64,1) both;animation-delay:calc(var(--task-i,0) * 55ms)}

/* Typography improvements */
.section-tag{font-size:11.5px;font-weight:800;letter-spacing:.07em}
.h-name{font-size:16px}
.tab .tab-label{font-weight:800}
.task-text{font-size:14px;line-height:1.65}
.lit-work{font-size:16px}

/* Day label as pill */
.day-label{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 14px;align-self:center;display:inline-block;margin:0 auto}
#messages .day-label{text-align:center;display:block;width:fit-content;margin:8px auto}

/* Better typing indicator */
.typing-bubble::before{content:'Компас';font-size:11px;color:var(--muted);margin-right:6px;font-family:'Space Grotesk',sans-serif;font-weight:600}

/* Tab transition smoother */
.tab::after{transition:background .25s cubic-bezier(0.34,1.56,0.64,1)}
.tab{transition:background .18s ease}

/* Send button - more satisfying */
#send-btn:not(:disabled):hover{transform:scale(1.1) !important;transition:transform .2s cubic-bezier(0.34,1.56,0.64,1)}

/* Mission card — subtle top accent gradient */
.mission-card::before{content:'';display:block;height:2px;background:linear-gradient(90deg,var(--mat),var(--bel),var(--lit));border-radius:var(--radius) var(--radius) 0 0}

/* ── HEADER BUTTONS ── */
/* Stats button — circular, lit purple */
#progress-btn{
  width:36px;height:36px;padding:0;border-radius:50%;
  background:rgba(167,139,250,0.12);
  border:1.5px solid rgba(167,139,250,0.4);
  color:var(--lit);display:flex;align-items:center;justify-content:center;
}
#progress-btn i{font-size:18px}
#progress-btn:hover{background:rgba(167,139,250,0.22);box-shadow:0 0 14px rgba(167,139,250,0.3);transform:scale(1.06)}
#progress-btn:active{transform:scale(0.92) !important}

/* New mission button — gradient border (mission stripe colors) */
#new-mission-btn{
  background:linear-gradient(var(--surface),var(--surface)) padding-box,
             linear-gradient(135deg,var(--mat),var(--bel),var(--lit)) border-box;
  border:1.5px solid transparent;
  color:#e2e8f0;
  font-size:12.5px;font-weight:500;
  display:flex;align-items:center;gap:5px;
}
#new-mission-btn i{font-size:15px}
#new-mission-btn:hover{
  background:linear-gradient(rgba(255,255,255,0.06),rgba(255,255,255,0.06)) padding-box,
             linear-gradient(135deg,var(--mat),var(--bel),var(--lit)) border-box;
  color:#fff;
}
#new-mission-btn:active{transform:scale(0.95) !important}

/* ── MISSION HUB (Elevate-style vertical list) ── */
.mission-hub{background:var(--card);border:1px solid var(--border);border-radius:0;border-left:none;border-right:none;overflow:hidden;animation:springUp .45s cubic-bezier(0.34,1.56,0.64,1) both}
.hub-header{padding:12px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between}
.hub-title{font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hub-done-count{font-size:12px;font-weight:600;color:var(--muted)}
.hub-done-count.all-done{color:#4ade80}
.module-list{padding:10px 14px 16px;display:flex;flex-direction:column;gap:4px}
.ml-line{width:2px;height:10px;background:var(--border);margin-left:17px;flex-shrink:0}
.ml-row{display:flex;align-items:center;gap:12px}
.ml-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:var(--bg);flex-shrink:0;transition:all .3s}
.ml-dot.active{border-color:var(--mat);background:var(--mat)}
.ml-dot.bel-active{border-color:var(--bel);background:var(--bel)}
.ml-dot.lit-active{border-color:var(--lit);background:var(--lit)}
.ml-dot.done-dot{border-color:#4ade80;background:#4ade80}
.ml-dot.locked-dot{opacity:.35}
.ml-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 16px;display:flex;align-items:center;gap:13px;cursor:pointer;transition:all .18s;position:relative}
.ml-card.recommended{border-color:rgba(79,172,254,0.4)}
.ml-card.bel-rec{border-color:rgba(247,183,49,0.4)}
.ml-card.lit-rec{border-color:rgba(167,139,250,0.4)}
.ml-card.done-card{border-color:rgba(74,222,128,0.25);background:rgba(74,222,128,0.04);cursor:default}
.ml-card.started-card{border-color:rgba(247,183,49,0.4)}
.ml-card.locked-card{opacity:.7;cursor:not-allowed;background:rgba(251,191,36,0.04);border-color:rgba(251,191,36,0.2)}
.ml-card:not(.done-card):not(.locked-card):hover{filter:brightness(1.1)}
.ml-icon{font-size:25px;flex-shrink:0;display:flex;align-items:center}
.ml-icon i{font-size:25px}
.ml-info{flex:1;min-width:0}
.ml-name{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700}
.ml-meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.ml-rec-badge{position:absolute;top:8px;right:36px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(79,172,254,0.15);color:var(--mat)}
.ml-arrow{font-size:18px;color:var(--muted);flex-shrink:0}

/* ── MODULE OVERLAY ── */
#module-overlay{position:fixed;inset:0;background:var(--bg);z-index:160;display:none;flex-direction:column}
#module-overlay.visible{display:flex;animation:springUp .3s cubic-bezier(0.34,1.56,0.64,1) both}
.mo-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.mo-header button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;padding:0;display:flex;align-items:center;line-height:1}
.mo-prog-bar{height:3px;background:var(--border);flex-shrink:0}
.mo-prog-fill{height:100%;border-radius:3px;transition:width .4s cubic-bezier(0.34,1.56,0.64,1)}
.mo-body{flex:1;overflow-y:auto;padding:28px 20px 16px;display:flex;flex-direction:column}
.mo-q-num{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:18px}
.mo-q-text{font-size:17px;line-height:1.72;color:var(--text);animation:slideInQ .3s cubic-bezier(0.34,1.56,0.64,1) both}
@keyframes slideInQ{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
.mo-done-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 24px;text-align:center}
.mo-done-icon{font-size:52px;animation:springUp .5s cubic-bezier(0.34,1.56,0.64,1) both}
.mo-done-title{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700}
.mo-done-sub{font-size:14px;color:var(--muted);line-height:1.65;max-width:280px}
.mo-footer{padding:12px 16px 14px;border-top:1px solid var(--border);flex-shrink:0;display:flex;justify-content:flex-end;background:var(--surface)}
.mo-btn{border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:700;padding:13px 24px;cursor:pointer;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;gap:8px;transition:all .2s;background:linear-gradient(135deg,var(--mat),var(--lit))}
.mo-btn:hover{transform:scale(1.03)}
.mo-btn:active{transform:scale(0.95) !important}

/* ── MODULE DETAIL CARD (inline in chat) ── */
.module-detail-card{background:var(--card);border:1px solid var(--border);border-radius:0;border-left:none;border-right:none;overflow:hidden;animation:springUp .4s cubic-bezier(0.34,1.56,0.64,1) both}
.mdc-header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.mdc-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700}
.mdc-footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.mdc-hint{font-size:12px;color:var(--muted);flex:1}
.mdc-back-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:0;display:flex;align-items:center;flex-shrink:0;transition:color .15s}
.mdc-back-btn:hover{color:var(--text)}
.mdc-back-btn:active{transform:scale(0.9)}
.mdc-back-pill{font-size:11px;font-weight:600;color:var(--muted);background:var(--border);border-radius:10px;padding:3px 8px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.mdc-back-pill:hover{color:var(--text);background:var(--surface)}
.mdc-upload-btn{flex-shrink:0;background:linear-gradient(135deg,var(--mat),var(--lit));border:none;border-radius:12px;color:#fff;font-size:13px;font-weight:700;padding:9px 16px;cursor:pointer;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;gap:6px;transition:all .18s}
.mdc-upload-btn:active{transform:scale(0.92)}

/* Status dot on module cards */
.ml-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-right:-2px}
.ml-status-dot.pending-s{}
.ml-status-dot.started-s{background:#f7b731;box-shadow:0 0 6px rgba(247,183,49,0.5);animation:pulse 2s infinite}
.ml-status-dot.done-s{background:#4ade80}

/* ── HUB GREETING (in main pane) ── */
/* hub greeting — just date above the card */
.hg-date{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:12px 16px 8px}
/* hub theme subtitle */
.hub-theme-sub{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4;padding-right:8px}

/* ── CHAT PANE — smaller font ── */
#chat-pane .bubble{font-size:13px;line-height:1.55;padding:9px 12px}
#chat-pane .msg-meta{font-size:9px}
#chat-pane .task-text{font-size:13px}
#chat-pane #user-input{font-size:14px}

/* ── FEEDBACK NOTIFICATION (in main pane) ── */
.feedback-notif{position:sticky;bottom:0;left:0;right:0;background:linear-gradient(135deg,rgba(79,172,254,0.15),rgba(167,139,250,0.15));border-top:1px solid rgba(167,139,250,0.3);padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;animation:slideInQ .3s cubic-bezier(0.34,1.56,0.64,1) both;z-index:5}
.feedback-notif .fn-icon{font-size:18px;flex-shrink:0}
.feedback-notif .fn-text{flex:1;font-size:13px;font-weight:600;color:var(--text)}
.feedback-notif .fn-arrow{color:var(--lit);font-size:16px;animation:bounce 1s infinite}

/* ── MODULE DONE STATE ── */
.module-done-view{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;gap:14px;min-height:200px}
.mdv-icon{font-size:52px;animation:springUp .5s cubic-bezier(0.34,1.56,0.64,1) both}
.mdv-title{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700}
.mdv-sub{font-size:13px;color:var(--muted);line-height:1.6}
.mdv-stat{font-size:15px;font-weight:700;color:var(--text);margin:6px 0 4px}
.mdv-summary{font-size:12.5px;color:var(--muted);line-height:1.5;max-width:320px;margin:0 auto 10px;font-style:italic}
.mdv-btn{background:none;border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;font-weight:600;padding:11px 22px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .18s;display:flex;align-items:center;gap:7px;margin-top:4px}
#mdv-chess-btn{background:linear-gradient(135deg,var(--lit),#8b6cf1);border:none;color:#fff}
.mdv-btn-secondary{font-size:13px;padding:9px 18px;color:var(--muted)}
.mdv-btn:hover{border-color:var(--lit);color:var(--lit)}

/* ── WELCOME SCREEN (in main pane) ── */
.welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;min-height:200px;gap:10px}
.ws-date{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ws-icon{font-size:48px;animation:springUp .5s cubic-bezier(0.34,1.56,0.64,1) both}
.ws-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.02em}
.ws-message{font-size:14px;color:var(--muted);line-height:1.7;max-width:320px}
.ws-message strong{color:var(--text)}
.ws-dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.ws-dots span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.ws-dots span:nth-child(2){animation-delay:.2s}
.ws-dots span:nth-child(3){animation-delay:.4s}

/* ── STREAK & CRYSTALS ── */
.h-streak{font-size:11px;font-weight:700;color:#f97316;display:inline-flex;align-items:center;gap:3px;margin-top:1px}
.h-streak::before{content:'🔥';font-size:12px}

/* Crystal toast */
#crystal-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 18px;display:flex;align-items:center;gap:10px;z-index:200;opacity:0;transition:all .3s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
#crystal-toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}
.ct-icon{font-size:24px}
.ct-text{}
.ct-title{font-size:13px;font-weight:700;color:var(--text);font-family:'Space Grotesk',sans-serif}
.ct-sub{font-size:11px;color:var(--muted);margin-top:1px}

/* Crystal collection in progress overlay */
.crystal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.crystal-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.crystal-icon{font-size:24px;flex-shrink:0}
.crystal-info{}
.crystal-name{font-size:12px;font-weight:700;color:var(--text);font-family:'Space Grotesk',sans-serif}
.crystal-count{font-size:11px;color:var(--muted);margin-top:1px}
.crystal-card.earned{border-color:rgba(167,139,250,0.35);background:rgba(167,139,250,0.06)}
.crystal-card.earned .crystal-count{color:var(--lit)}

/* ── MOBILE OPTIMIZATIONS ── */
@media (max-width: 480px) {
  /* Header — по-компактен, бутоните не излизат */
  header{padding:10px 12px;gap:8px}
  .h-name{font-size:14px}
  .h-btn{font-size:11px;padding:5px 9px}
  .h-btn-icon{padding:5px 8px}

  /* Messages — по-малко padding отстрани (НЕ голям padding — layout-ът е split-view, не full-screen overlay) */
  #messages{padding:8px 10px 4px}

  /* Mission card tabs — по-компактни */
  .tab{padding:9px 4px 7px}
  .tab .tab-icon{font-size:15px}
  .tab .tab-label{font-size:9.5px}
  .tab .tab-count{font-size:8px}
  .tabs{top:58px}

  /* Task rows — по-малко padding */
  .task-row{padding:8px 0}
  .task-badge{width:22px;height:22px;font-size:10px}
  .task-text{font-size:13px}
  .tab-panel{padding:12px}

  /* Bubbles */
  .bubble{font-size:13.5px;padding:10px 13px}
  .msg{max-width:92%}

  /* Input area — по-компактен */
  #input-area{padding:8px 10px 10px;gap:7px}
  #user-input{font-size:14px;padding:9px 13px}
  #upload-btn{width:34px;height:34px}
  #send-btn{width:38px;height:38px}

  /* Chess reward — вертикален layout на малък екран */
  .chess-reward-inner{padding:9px 12px;gap:8px}
  .chess-reward-title{font-size:12px}
  .chess-reward-sub{font-size:10px}

  /* Floating chess btn — малко по-нагоре */
  #chess-float-btn{bottom:75px;right:12px;width:44px;height:44px;font-size:20px}

  /* Progress overlay */
  .po-panel{border-radius:16px 16px 0 0}
  .po-tabs .po-tab{font-size:11px;padding:7px 4px}

  /* Missed day choice buttons — stack vertically */
  .missed-day-choice{flex-direction:column}

  /* Chess board — full width on mobile */
  .chess-panel{max-width:100%;border-radius:16px 16px 0 0}
  .chess-board-wrap{padding:8px}
  .sq{font-size:clamp(20px,8vw,32px)}

  /* Section tag */
  .section-tag{font-size:10px;margin-bottom:6px}
}

/* Safe area for notched phones (iPhone X+) */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  #footer-area{padding-bottom: env(safe-area-inset-bottom)}
}
</style>

<script>
// ── State ──
const WEBHOOK_URL = 'https://kompas-api.dobibanova.workers.dev'; // Make.com webhook — API key lives in Make.com
let conversationHistory = [];
let pendingImageBase64 = null;
let pendingImageType = null;
let isLoading = false;

const DAILY_THEMES = [
  { label: 'Кристална структура', emoji: '💎', hint: 'аметист и кристали' },
  { label: 'Шахматна комбинация', emoji: '♟️', hint: 'шах' },
  { label: 'Химичен опит', emoji: '🧪', hint: 'химия' },
  { label: 'Геометрична разгъвка', emoji: '🔷', hint: '3D фигури' },
  { label: 'Вулканичен минерал', emoji: '🌋', hint: 'минерали' },
  { label: 'Октаедър', emoji: '🔮', hint: '3D фигури' },
  { label: 'Кварцова решетка', emoji: '✨', hint: 'кристали' },
];
const todayTheme = DAILY_THEMES[new Date().getDay() % DAILY_THEMES.length];

// ── DEMO DATA for Progress overlay (примерни данни — реалните ще идват от Google Sheets) ──
// ── REQUIRED READING LIST (full, for reference when Sheets data incomplete) ──
const READING_LIST = [
  { group:'Стихотворения и разкази', items:[
    {t:'Хайдути', a:'Христо Ботев'}, {t:'На прощаване в 1868 г.', a:'Христо Ботев'},
    {t:'Хубава си, моя горо', a:'Любен Каравелов'},
    {t:'Отечество любезно, как хубаво си ти!', a:'Иван Вазов'},
    {t:'Опълченците на Шипка', a:'Иван Вазов'}, {t:'Българският език', a:'Иван Вазов'},
    {t:'Една българка', a:'Иван Вазов'},
    {t:'Стани, стани, юнак балкански', a:'Добри Чинтулов'},
    {t:'Вятър ечи, Балкан стене', a:'Добри Чинтулов'},
    {t:'Братчетата на Гаврош', a:'Христо Смирненски'},
    {t:'Серафим', a:'Йордан Йовков'}, {t:'По жицата', a:'Йордан Йовков'},
    {t:'Косачи', a:'Елин Пелин'}, {t:'По жътва', a:'Елин Пелин'},
    {t:'Художник', a:'Веселин Ханчев'}, {t:'Неразделни', a:'Пенчо Славейков'},
    {t:'Заточеници', a:'Пейо Яворов'},
  ]},
  { group:'По-дълги творби', items:[
    {t:'Из "Под игото" — "Представлението"', a:'Иван Вазов'},
    {t:'Из "Под игото" — "Радини вълнения"', a:'Иван Вазов'},
    {t:'Из "Немили-недраги"', a:'Иван Вазов'},
    {t:'Из "Бай Ганьо" — "Бай Ганьо пътува"', a:'Алеко Константинов'},
    {t:'Из "До Чикаго и назад"', a:'Алеко Константинов'},
  ]},
];

// ── Progress overlay logic ──
let progressData = null;
let currentPoTab = 'history';

const progressOverlay = document.getElementById('progress-overlay');
const progressBtn = document.getElementById('progress-btn');
const poCloseBtn = document.getElementById('po-close-btn');
const poBody = document.getElementById('po-body');

progressBtn.addEventListener('click', async () => {
  progressOverlay.classList.add('visible');
  poBody.innerHTML = `<div class="po-note" style="text-align:center;padding:24px 0;color:var(--muted)">Зареждане...</div>`;
  try {
    const res = await fetch(WEBHOOK_URL + '/progress');
    progressData = res.ok ? await res.json() : null;
  } catch(e) { progressData = null; }
  renderPoTab(currentPoTab);
});
poCloseBtn.addEventListener('click', () => progressOverlay.classList.remove('visible'));
progressOverlay.addEventListener('click', e => { if(e.target===progressOverlay) progressOverlay.classList.remove('visible'); });

document.querySelectorAll('.po-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.po-tab').forEach(t => t.classList.toggle('active', t===tab));
    currentPoTab = tab.dataset.poTab;
    renderPoTab(currentPoTab);
  });
});

function renderPoTab(name) {
  if (name === 'history') renderHistoryTab();
  else if (name === 'reading') renderReadingTab();
  else renderSkillsTab();
}

function renderHistoryTab() {
  poBody.innerHTML = '';

  // Crystal collection section
  const state = loadGameState();
  const crystalSection = document.createElement('div');
  crystalSection.innerHTML = `<div class="skill-group-label">Колекция кристали</div>`;
  const grid = document.createElement('div');
  grid.className = 'crystal-grid';
  Object.entries(CRYSTALS).forEach(([key, c]) => {
    const count = state.crystals[key] || 0;
    const card = document.createElement('div');
    card.className = `crystal-card ${count > 0 ? 'earned' : ''}`;
    card.innerHTML = `<span class="crystal-icon">${count > 0 ? c.emoji : '🩶'}</span><div class="crystal-info"><div class="crystal-name">${c.name}</div><div class="crystal-count">${count > 0 ? `×${count}` : 'Все още не е спечелен'}</div></div>`;
    grid.appendChild(card);
  });
  crystalSection.appendChild(grid);
  poBody.appendChild(crystalSection);

  const rows = progressData?.missions || [];
  if (!rows.length) {
    const note = document.createElement('div');
    note.className = 'po-note';
    note.textContent = 'Все още няма записани мисии.';
    poBody.appendChild(note);
    return;
  }

  // Построяваме lookup: дата → set от завършени модули (mat/bel/lit) за деня
  const completionsByDate = {};
  (progressData?.completions || []).forEach(r => {
    const d = r[0], mod = (r[1] || '').toLowerCase();
    if (!d || !mod) return;
    if (!completionsByDate[d]) completionsByDate[d] = new Set();
    completionsByDate[d].add(mod);
  });

  // Бележки за наблюдения (АДАПТАЦИЯ), групирани по дата — за да ги покажем в детайла на деня
  const notesByDate = {};
  (progressData?.notes || []).forEach(r => {
    const d = r[0], text = r[3];
    if (!d || !text) return;
    (notesByDate[d] = notesByDate[d] || []).push(text);
  });

  const modLabels = { mat: 'МАТ', bel: 'БЕЛ', lit: 'ЛИТ' };

  // rows: [date, theme, emoji, mission_json, status, photo_count]
  [...rows].reverse().slice(0, 15).forEach(r => {
    const date = r[0] || '';
    let mission = {};
    try { mission = JSON.parse(r[3] || '{}'); } catch(e) {}
    const doneSet = completionsByDate[date] || new Set();
    const litWork = mission?.lit?.work || '—';

    const card = document.createElement('div');
    card.className = 'hist-card';

    const pill = (mod, icon, label) => {
      const isDone = doneSet.has(mod);
      return `<span class="hist-pill ${mod} ${isDone ? 'pill-done' : 'pill-untouched'}">
        <i class="ti ${isDone ? 'ti-circle-check' : icon}"></i> ${label}
      </span>`;
    };

    card.innerHTML = `
      <div class="hist-top">
        <span class="hist-date">${date}</span>
        <span class="hist-theme">${r[2] || ''} ${r[1] || ''}</span>
      </div>
      <div class="hist-summary">
        ${pill('mat', 'ti-ruler', 'МАТ')}
        ${pill('bel', 'ti-pencil', 'БЕЛ')}
        ${pill('lit', 'ti-book-2', litWork)}
      </div>
      <div class="hist-toggle"><i class="ti ti-chevron-down"></i> Виж задачите на деня</div>
      <div class="hist-detail"></div>`;

    const toggle = card.querySelector('.hist-toggle');
    const detail = card.querySelector('.hist-detail');
    let built = false;
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const expanding = !detail.classList.contains('visible');
      detail.classList.toggle('visible', expanding);
      toggle.classList.toggle('expanded', expanding);
      if (expanding && !built) {
        built = true;
        detail.innerHTML = buildHistDetailHTML(mission, modLabels, doneSet, notesByDate[date]);
      }
    });

    poBody.appendChild(card);
  });
}

// Построява HTML за разгънатите детайли на един ден: текстове на задачите + бележки
function buildHistDetailHTML(mission, modLabels, doneSet, notesForDay) {
  let html = '';
  const group = (mod, title, items) => {
    if (!items || !items.length) return '';
    const status = doneSet.has(mod) ? ' ✓ завършено' : ' — недокоснато';
    const qs = items.map(q => `<div class="hist-detail-q">• ${q}</div>`).join('');
    return `<div class="hist-detail-group"><b>${title}${status}</b>${qs}</div>`;
  };
  html += group('mat', 'Математика', mission.mat);
  html += group('bel', 'Български', mission.bel);
  html += group('lit', mission.lit?.work ? `Литература — ${mission.lit.work}` : 'Литература', mission.lit?.questions);
  if (notesForDay && notesForDay.length) {

}

function renderSkillsTab() {
  poBody.innerHTML = '';
  const notes = progressData?.notes || [];

  // Build a map: competency code → last note content
  const noteMap = {};
  notes.forEach(r => {
    const text = r[3] || '';
    // Match М1, Б12, ЕД3, Ч10, П9, РП2 at start of note
    const match = text.match(/^([А-ЯЕа-яеРП]{1,3}\d{1,2})[::\s]/);
    if (match) noteMap[match[1].toUpperCase()] = { content: text, date: r[0] };
  });

  const totalPracticed = Object.keys(noteMap).length;
  const totalAll = ALL_COMPETENCIES.reduce((s,g) => s + g.items.length, 0);

  const summary = document.createElement('div');
  summary.className = 'read-progress';
  summary.innerHTML = `🎯 Практикувани: <b>${totalPracticed}/${totalAll}</b> умения`;
  poBody.appendChild(summary);

  ALL_COMPETENCIES.forEach(group => {
    const label = document.createElement('div');
    label.className = 'skill-group-label';
    label.textContent = group.group;
    poBody.appendChild(label);

    group.items.forEach(s => {
      const note = noteMap[s.c];
      const row = document.createElement('div');
      row.className = 'skill-row';
      row.style.alignItems = 'flex-start';
      row.style.paddingTop = '8px';
      const dot = note
        ? `<span class="skill-dot good" style="background:${group.color};box-shadow:0 0 6px ${group.color}44;margin-top:4px"></span>`
        : `<span class="skill-dot none" style="margin-top:4px"></span>`;
      const noteText = note
        ? `<span style="font-size:10.5px;color:var(--muted);display:block;margin-top:2px">${note.content.replace(/^[^ ]+ /,'').slice(0,60)}${note.content.length > 65 ? '…' : ''}</span>`
        : '';
      row.innerHTML = `
        <span class="skill-code" style="color:${group.color};padding-top:2px">${s.c}</span>
        <div style="flex:1;min-width:0"><span class="skill-label">${s.l}</span>${noteText}</div>
        ${dot}`;
      poBody.appendChild(row);
    });
  });
}


const SYSTEM_PROMPT = `Ти си Компас — личен AI коуч по математика и БЕЛ за 12-годишен момче, което се подготвя за НВО в края на 7-ми клас в България. Работиш само на БЪЛГАРСКИ.

ПРОФИЛ НА УЧЕНИКА:

ПРОВЕРКА ПРЕДИ ОБРАТНА ВРЪЗКА (КРИТИЧНО — НИКОГА НЕ ПРОПУСКАЙ ТОВА):
- Преди да кажеш на ученика, че има грешка, ВИНАГИ първо сам пресметни верния отговор — НЕ наум, а ЯВНО, разпиши всяка стъпка на изчислението, особено събиране, изваждане, умножение. Никога не разчитай на бърза мисловна сметка — тя е точно толкова податлива на грешки, колкото на ученика.
- При проверка на изваждане или събиране с по-големи числа — разбий на по-лесни стъпки (напр. 95 − 36 = 95 − 30 − 6 = 65 − 6 = 59), за да намалиш риска от грешка.
- Никога не задавай риторичен въпрос от типа "Провери: X колко е всъщност?" без САМ да си показал явно изчислението, довело до верния отговор. Ако не можеш да покажеш изчислението стъпка по стъпка, не твърди, че има грешка.
- Ако проверяваш снимка на ръкописно решение — прочети ВСЯКА цифра поотделно и внимателно, особено ако почеркът е неясен. При съмнение за конкретна цифра или знак, попитай ученика да поясни вместо да приемеш грешно тълкуване.
- Грешно обявяване на правилен отговор за грешен е по-лошо от пропусната истинска грешка — то руши увереността на ученика в собствените му способности. При всяка несигурност — питай, не предполагай.
- Ако след собствена явна проверка установиш, че отговорът на ученика е верен, кажи го ясно и директно, без излишни уговорки.

СОБСТВЕНА ЕЗИКОВА ГРАМОТНОСТ (КРИТИЧНО — ти си БЕЛ coach, собствените ти грешки са недопустими):
- Прочети СВОЯ отговор наум веднъж преди да го изпратиш и провери специално най-честите капани в българския: пълен срещу кратък определителен член за мъжки род (напр. "ученикът" като подлог срещу "ученика" като допълнение); съгласуване по род/число между подлог и сказуемо, между съществително и прилагателно; правилно членуване; препинателни знаци при вметнати и подчинени изречения (обособени части, обръщения); разделно/слято писане на "не" с глаголи и други части на речта.
- ПРАВИЛО ЗА "В/ВЪВ", "С/СЪС", "К/КЪМ": използвай удължената форма (във, със, към — вместо в, с, към), когато следващата дума започва със същата или близка съгласна (най-вече в-/ф- за "във", с-/з- за "със"). Пример: "във второто изречение" (не "в второто"), "със стола" (не "с стола"), "във фирмата". Провери това изрично при всяко "в" и "с" пред следваща дума.

ОБРАТНА ВРЪЗКА ПО СНИМКА С РЕШЕНИЕ (когато съобщението на ученика съдържа снимка):
Преди да напишеш каквото и да е, прецени внимателно, гледайки самата снимка в контекста на "ТЕКУЩ ЕКРАН" по-долу (там пише кой модул е отворен и точния текст на зададените задачи):
1. Показва ли снимката РЕАЛЕН ръкописен опит за решаване на задача (не празен лист, не случаен предмет/животно/екран/селфи)?
2. Съответства ли съдържанието на решенията на ТОЧНО зададените задачи в "ТЕКУЩ ЕКРАН" (същите теми/номера/условия), а не на съвсем различни, несвързани задачи? Бъди стриктен тук — дори добре написан, но несвързан отговор означава несъответствие, не грешка.
3. Ако т.1 и т.2 са изпълнени — има ли системна грешка в конкретна компетенция (не еднократна случайност), която трябва да се коригира, преди денят да се приеме за завършен? Обикновена умора/труден ден/единични грешки НЕ се броят за системна грешка.

ЗАДЪЛЖИТЕЛЕН ФОРМАТ: първият ред на отговора ти трябва да бъде ТОЧНО един от следните три реда, без нищо друго преди него:
СТАТУС: OK
СТАТУС: RETRY
СТАТУС: INVALID
После остави един празен ред, и чак тогава пиши обичайната топла обратна връзка към ученика (тя никога не съдържа думата "СТАТУС").

- СТАТУС: INVALID → т.1 или т.2 не са изпълнени. Текстът след статуса любезно обяснява, че не разпознаваш опит по зададеното, и моли за истинска снимка на работата.
- СТАТУС: RETRY → валиден опит с системна грешка. Текстът след статуса посочва ясно и конкретно кой тип грешка/разсъждение трябва да поправи, обяснява защо, и моли за нова снимка само на коригираните отговори.
- СТАТУС: OK → валиден опит без системна грешка (единични грешки са ОК). Текстът след статуса: първо нещо конкретно свършено добре, после евентуални единични грешки без драматизиране, завършва с кратко насърчение.

  if (!isResizingChat) return;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const newHeight = Math.max(120, Math.min(window.innerHeight * 0.75, window.innerHeight - clientY));
  chatOverlay.style.height = newHeight + 'px';
  updateScrollHint();
}
function chatResizeEnd() {
  if (!isResizingChat) return;
  isResizingChat = false;
  resizeHandleEl.classList.remove('dragging');
  document.body.style.userSelect = '';
}
resizeHandleEl.addEventListener('mousedown', () => { isResizingChat = true; resizeHandleEl.classList.add('dragging'); document.body.style.userSelect = 'none'; });
resizeHandleEl.addEventListener('touchstart', () => { isResizingChat = true; resizeHandleEl.classList.add('dragging'); }, { passive: true });
window.addEventListener('mousemove', chatResizeMove);
window.addEventListener('touchmove', chatResizeMove, { passive: true });
window.addEventListener('mouseup', chatResizeEnd);

let missionRetryCount = 0; // предпазва от безкраен цикъл при повторен опит за генериране на мисия

let todayDateLabel = '';

async function startSession() {
  const today = new Date();
  const days = ['неделя','понеделник','вторник','сряда','четвъртък','петък','събота'];
  todayDateLabel = `${days[today.getDay()]}, ${today.toLocaleDateString('bg-BG',{day:'numeric',month:'long'})}`;
  // Date goes in main pane, not chat

  // Show loading welcome screen in main pane
  showLoadingScreen();

  // ПАРАЛЕЛНО, не последователно — преди проверката за вчера (пълен /progress
  // round-trip: Google OAuth + 3 Sheets четения) чакаше да приключи, преди
  // изобщо да започне зареждането на днешната мисия. Това удвояваше времето
  // за първоначално зареждане без нужда.
  const [progressInfo, missionData] = await Promise.all([
    checkProgress(),
    fetchMissionData(),
  ]);

  if (progressInfo.missed) {
    renderMissedDayPrompt(progressInfo.missed);
  } else if (missionData && missionData.mission && missionData.mission.mat) {
    // Възстановяваме кои модули за ДНЕС вече са отбелязани готови (напр. детето
    // е затворило приложението и се връща по-късно същия ден) — иначе всяко
    // презареждане тихо нулираше прогреса на "pending", независимо дали
    // модулът реално вече е бил завършен в по-ранна сесия същия ден.
    renderTodayMission(missionData.mission, missionData.theme, progressInfo.todayDone);
  } else {
    generateMissionOnDemand();
  }
}

// Проверява /progress ЕДНЪж и връща и двете неща, които са ни нужни от него:
// (1) реално недовършена мисия от ВЧЕРА (missed), и (2) кои модули за ДНЕС
// вече са отбелязани завършени в по-ранна сесия същия ден (todayDone) — за
// да не се губи прогресът при затваряне/презареждане на приложението.
async function checkProgress() {
  const todayISO = new Date().toISOString().slice(0, 10);
  const yISO = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  try {
    const res = await fetch(WEBHOOK_URL + '/progress');
    if (!res.ok) return { missed: null, todayDone: new Set() };
    const data = await res.json();

    const todayDone = new Set(
      (data.completions || []).filter(c => c[0] === todayISO).map(c => (c[1] || '').toLowerCase())
    );

    let missed = null;
    const row = (data.missions || []).find(r => r[0] === yISO);
    if (row) {
      let mission = null;
      try { mission = JSON.parse(row[3] || '{}'); } catch(e) { mission = null; }
      if (mission && mission.mat) {
        const doneSet = new Set(
          (data.completions || []).filter(c => c[0] === yISO).map(c => (c[1] || '').toLowerCase())
        );
        const allModules = ['mat', 'bel', 'lit'];
        const missing = allModules.filter(m => !doneSet.has(m));
        if (missing.length > 0) {
          missed = {
            mission,
            theme: { label: row[1] || '', emoji: row[2] || '' },
            done: allModules.filter(m => doneSet.has(m)),
            missing,
            dateISO: yISO,
          };
        }
      }
    }
    return { missed, todayDone };
  } catch(e) {
    console.warn('[checkProgress] грешка (мрежа?) — прескачаме напомнянето/възстановяването:', e);
    return { missed: null, todayDone: new Set() };
  }
}

    : '<i class="ti ti-book-2" style="font-size:14px;vertical-align:-2px;color:#a78bfa;"></i> ЛИТ';

  currentMission = d.mission;
  moduleState.mat = d.done.includes('mat') ? 'done' : 'pending';
  moduleState.bel = d.done.includes('bel') ? 'done' : 'pending';
  moduleState.lit = d.done.includes('lit') ? 'done' : 'pending';
  moduleCards.mat = null; moduleCards.bel = null; moduleCards.lit = null;
  moduleTaskProgress = {}; moduleRetryCounts = {};
  conversationHistory = [];

// Само мрежовата заявка, БЕЗ render — позволява извикване паралелно с други
// заявки (напр. checkYesterdayIncomplete) при първоначално зареждане.
async function fetchMissionData() {
  try {
    const res = await fetch(WEBHOOK_URL + '/mission');
    if (res.ok) {
      const data = await res.json();
      return { mission: data.mission, theme: data.theme || todayTheme };
    }
  } catch(e) {
    console.warn('[fetchMissionData] грешка:', e);
  }
  return null;
}

// Показва днешната мисия в интерфейса (reset на state + render) — отделено от
// самия fetch, за да може да се преизползва и от startSession, и от бутона "Нова мисия".
function renderTodayMission(mission, theme, restoreDone) {
  const introText = mission.intro || '';
  // ВАЖНО: не нулираме сляпо всичко на "pending" — ако модул вече е бил
  // завършен в по-ранна сесия същия ден (детето е затворило приложението и
  // се връща по-късно), възстановяваме статуса му от ModuleCompletions,
  // вместо тихо да губим прогреса при всяко презареждане на страницата.
  const done = restoreDone || new Set();
  moduleState.mat = done.has('mat') ? 'done' : 'pending';
  moduleState.bel = done.has('bel') ? 'done' : 'pending';
  moduleState.lit = done.has('lit') ? 'done' : 'pending';
  moduleCards.mat = null;
  moduleCards.bel = null;
  moduleCards.lit = null;
  moduleTaskProgress = {}; moduleRetryCounts = {};
  // За вече завършените модули маркираме и всички задачи като потвърдени,
  // за да се виждат отметките коректно, ако детето отвори конкретния модул.
  done.forEach(type => {
    const total = getModuleQuestionsFor(mission, type);
    if (total > 0) moduleTaskProgress[type] = new Set(Array.from({length: total}, (_, i) => i + 1));
  });
  const wasAlreadyUnlocked = chessUnlocked;
  if (done.size >= 3 && !chessUnlocked) {
    chessUnlocked = true; // само флагът тук — UI update чака DOM-а по-долу
  }

  // КРИТИЧНО: мисията идва от кеш (не от чат разговор), но чатът трябва
  // да "помни" какви точно са зададените задачи, за да може по-късно да
  // сравнява снимка с решения срещу РЕАЛНО зададеното, а не да гадае.
  conversationHistory = [];
  conversationHistory.push({role:'user', content: `ГЕНЕРИРАЙ_МИСИЯ: Тема на деня: "${theme.hint || ''}".`});
  conversationHistory.push({role:'assistant', content: JSON.stringify(mission)});

  renderMissionHubView(mission, theme, introText || '');
  // Едва СЛЕД render-а на hub картата (за да съществува .chess-reward в DOM-а) —
  // само UI update, НЕ awardCrystal('quartz') отново (вече е даден по-рано).
  if (chessUnlocked && !wasAlreadyUnlocked) {
    updateChessButtons(true);
  }
  setQuickReplies();
}

async function requestMission() {
  // Използва се от бутона "Нова мисия" — тук няма нужда от паралелна проверка
  // за вчера (вече е минала при първоначалното зареждане на сесията).
  const typingEl = appendTyping();
  const data = await fetchMissionData();
  typingEl.remove();
  if (data && data.mission && data.mission.mat) {
    renderTodayMission(data.mission, data.theme);
  } else {
    generateMissionOnDemand();
  }
}

function getThemeColor(theme) {
  const hints = { 'шах': '#f7b731', 'кристали': '#a78bfa', 'химия': '#4facfe', '3D': '#4facfe', 'минерали': '#4cdb8a' };
  for (const [k, v] of Object.entries(hints)) {
    if ((theme?.hint || '').toLowerCase().includes(k)) return v;
  }
  return '#a78bfa';
}

async function generateMissionOnDemand() {
  // ВАЖНО: вече не минава през стария бавен единичен callClaude prompt —
  // вместо това пак удря GET /mission, което на сървъра сега ползва 2
  // паралелни, по-къси извиквания (МАТ+БЕЛ + ЛИТ) вместо едно дълго. Иначе
  // fallback пътят щеше да остане на стария бавен/чуплив механизъм, докато
  // основният вече е поправен.
  const data = await fetchMissionData();
  if (data && data.mission && data.mission.mat) {
    missionRetryCount = 0;
    renderTodayMission(data.mission, data.theme);
  } else {
    console.error('[Мисия] Неуспешно генериране (пореден опит):', data);
    if (missionRetryCount < 1) {
      missionRetryCount++;
      showLoadingScreen('Един момент, дай ми да пробвам пак да подготвя днешната мисия… 🔄');
      generateMissionOnDemand();
    } else {
      missionRetryCount = 0;
      hubView.innerHTML = `
        <div class="welcome-screen">
          <div class="ws-icon">😕</div>
          <div class="ws-title">Нещо се обърка</div>
          <div class="ws-message">Не успях да подготвя днешната мисия точно сега. Пробвай отново.</div>
          <div class="missed-day-choice">
            <button class="md-btn primary" id="mission-retry-btn">Опитай пак</button>
          </div>
        </div>`;
      document.getElementById('mission-retry-btn').addEventListener('click', () => {
        missionRetryCount = 0;
        showLoadingScreen();
        generateMissionOnDemand();
      });
      setQuickReplies();
    }
  }
}

  const reader = new FileReader();

      uploadPreview.classList.add('visible');

  reader.readAsDataURL(file);
  fileInput.value = '';
});

function compressImage(dataUrl, maxBytes, callback) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    // Max dimension 1600px — достатъчно за четене на ръкопис
    const MAX_DIM = 1600;
    let w = img.width, h = img.height;
    if (w > MAX_DIM || h > MAX_DIM) {
      if (w > h) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
      else       { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
    }
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);

    // Намаляй качеството докато не е под maxBytes
    let quality = 0.85;
    let result = canvas.toDataURL('image/jpeg', quality);
    while (result.length * 0.75 > maxBytes && quality > 0.3) {
      quality -= 0.1;
      result = canvas.toDataURL('image/jpeg', quality);
    }
    callback(result);
  };
  img.src = dataUrl;
}
function clearUpload() {
  pendingImageBase64 = null; pendingImageType = null;
  uploadPreview.classList.remove('visible'); previewImg.src = '';
}

// Инструкциите за преценка — вкарват се директно в messages (не само в
// system_prompt), защото се оказа, че system_prompt вероятно не стига до модела
// (Worker-ът има свой фиксиран system prompt). messages е гарантирано, че стига.
// hasImage=false покрива случая, когато детето допълва пропусната част само с
// текст в чата — това е напълно приемливо съдържателно, не изисква нова снимка.
function buildReviewInstructions(moduleType, hasImage) {
  const cfg = MODULE_CFG[moduleType];
  const taskTexts = getModuleQuestions(moduleType);
  const tasksBlock = taskTexts.length
    ? taskTexts.map((t, i) => `${i+1}. ${t}`).join('\n')
    : '(няма налична информация за конкретните зададени задачи)';
  const sourceLine = hasImage
    ? 'Ученикът изпраща снимка на решение (нова или допълваща предишен опит).'
    : 'Ученикът допълва/коригира предишен опит САМО с текст в чата, без нова снимка този път — това е приемливо съдържателно, ако вярно допълва липсващата част.';
  return `[ВАЖНА ИНСТРУКЦИЯ ЗА ТАЗИ ПРОВЕРКА — прочети преди да отговориш]
Ученикът трябваше да реши точно следните зададени задачи по ${cfg ? cfg.name : moduleType}:
${tasksBlock}

${sourceLine}
