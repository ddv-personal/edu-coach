1. Показва ли това, взето заедно с предходния контекст, РЕАЛЕН опит по зададеното (не празен лист, не случаен предмет/животно/екран/селфи, не напълно несвързан текст)?
2. Съответства ли съдържанието (снимка + текст заедно) на ТОЧНО зададените задачи по-горе, а не на съвсем различни, несвързани задачи? Бъди стриктен за несъответствие, но не бъркай "допълнение с текст на пропусната част" с несъответствие — ако текстът вярно допълва точно това, което е било поискано, той се брои.
3. ВИДИМО РАЗСЪЖДЕНИЕ/СТЪПКИ (гъвкаво, по преценка за всяка отделна задача): ако конкретната задача по естеството си предполага процес на разсъждение или изчисление (напр. многостъпкова математическа задача с формули/пресмятане, или задача, искаща обяснение/аргументация "защо"/"как"), провери дали ученикът реално е показал стъпките, а не само финален отговор без работа. Само правилен краен отговор БЕЗ видима работа за такава задача НЕ е достатъчно — дори числово верен. За задачи, които по природа нямат нужда от стъпки (кратък фактически отговор, едносрична дума и т.н.), не изисквай изкуствено такива.
4. Ако т.1, т.2 и т.3 са изпълнени — остава ли системна грешка в конкретна компетенция, която трябва да се коригира, преди денят да се приеме за завършен?

ЗАДЪЛЖИТЕЛЕН ФОРМАТ: първите ДВА реда на отговора ти трябва да бъдат ТОЧНО следните, без нищо друго преди тях:
СТАТУС: OK (или RETRY, или INVALID)
ЗАДАЧИ: <номера на задачите от списъка по-горе, които СЕГА потвърждаваш като напълно верни — кумулативно от целия разговор дотук, не само нови от това съобщение; напр. "1,3,5"; ако нито една не е потвърдено вярна, остави празно след двоеточието>
После остави един празен ред и чак тогава пиши обичайната топла обратна връзка към ученика (тя никога не съдържа думите "СТАТУС" или "ЗАДАЧИ").

- INVALID → т.1 или т.2 не са изпълнени.
- RETRY → все още липсва или е грешна поне една част от зададеното, ИЛИ т.3 не е изпълнено (задачата изисква видими стъпки/разсъждение, а има само финален отговор). В този случай обясни ясно и окуражаващо, че отговорът изглежда верен/добър, но искаш да видиш КАК е стигнал(а) дотам — конкретно кои задачи трябва да допълни с разписани стъпки.
- OK → вече има пълно и вярно решение на всичко зададено (снимка+текст заедно от разговора), включително видими стъпки/разсъждение където задачата ги изисква, денят/модулът се приема за завършен.

ВАЖНО за реда "ЗАДАЧИ:": бъди прецизен и консервативен — включвай номер САМО ако си напълно сигурен, че точно тази задача е изцяло вярна (и с нужните стъпки, ако се изискват). Крайното завършване на модула се брои автоматично от броя номера тук спрямо общия брой зададени задачи — не от общото ти впечатление в текста, затова точността на този ред е критична.`;
}

function sendMessage() {
  const text = inputEl.value.trim();
  if((!text && !pendingImageBase64) || isLoading) return;
  const hasImage = !!pendingImageBase64;
  const imgB64 = pendingImageBase64, imgType = pendingImageType;

  // КРИТИЧНО: ако детето в момента гледа конкретен модул (напр. БЕЛ), но снимката
  // се изпраща през общия бутон в чата (не през "Качи снимка" вътре в модула),
  // pendingModuleCompletion може да е останал стар (напр. от предишен опит по ЛИТ).
  // Затова при всяко изпращане (текст ИЛИ снимка) синхронизираме целта с това, което
  // РЕАЛНО се вижда на екрана точно сега — иначе Компас продължава да сравнява с грешния модул.
  const viewingModule = moduleViewEl.style.display === 'block' && currentModuleType;
  if (viewingModule) {
    pendingModuleCompletion = currentModuleType;
  }

  // ОБОБЩЕНО: докато си вътре в конкретен, все още НЕЗАВЪРШЕН модул, ВСЯКО
  // съобщение (текст или снимка, дори първото — не само поправка след снимка)
  // трябва да мине през строгата проверка. Преди това важеше само след снимка
  // или установена "висяща поправка" — затова директен текстов отговор без
  // предходна снимка изобщо не се проверяваше/маркираше.
  const viewingUnfinishedModule = viewingModule && moduleState[currentModuleType] !== 'done';
  const expectStatusReply = hasImage || viewingUnfinishedModule || (awaitingCorrectionFor && awaitingCorrectionFor === pendingModuleCompletion);

  const contentParts = [];
  if(hasImage) contentParts.push({type:'image',source:{type:'base64',media_type:imgType||'image/jpeg',data:imgB64}});
  if(text) contentParts.push({type:'text',text});
  if(expectStatusReply) contentParts.push({type:'text', text: buildReviewInstructions(pendingModuleCompletion, hasImage)});
  appendMessage('user', text, hasImage ? `data:${imgType};base64,${imgB64}` : null);
  inputEl.value = ''; inputEl.style.height='auto';
  // дали да очакваме "СТАТУС:" ред в отговора и да управляваме завършването по него
  lastMessageHadImage = expectStatusReply;
  // decide message format based on contentParts itself (BEFORE clearUpload resets pendingImageBase64)
  const isSingleTextOnly = contentParts.length === 1 && contentParts[0].type === 'text';
  conversationHistory.push({role:'user', content: isSingleTextOnly ? text : contentParts});
  clearUpload(); clearQuickReplies();

  if (expectStatusReply) {
    openChat(); // директно показваме, докато Компас "гледа" отговора/снимката
  }
  callClaude(null, false, false);
}

// Описва текущия екран на детето, за да не се налага чатът да гадае/пита
// "какъв беше въпросът" — вкарва се в system prompt-а динамично при всяко извикване.
function getCurrentScreenContext() {
  if (moduleViewEl.style.display === 'block' && currentModuleType) {
    const cfg = MODULE_CFG[currentModuleType];
    const questions = getModuleQuestions(currentModuleType);
    const qList = questions.map((q, i) => `${i+1}. ${q}`).join('\n');
    return `ТЕКУЩ ЕКРАН: ученикът в момента гледа модул "${cfg.name}" (${currentModuleType}) със следните задачи:\n${qList}\nАко въпросът му е неясен/общ (напр. "как се прави тази", "не разбирам условието"), приеми по подразбиране, че се отнася за ${cfg.name}, освен ако изрично не спомене друг предмет.`;
  }
  return `ТЕКУЩ ЕКРАН: ученикът е на общия изглед с трите модула (МАТ/БЕЛ/ЛИТ), не е избрал конкретен в момента.`;
}

// Забележка: отделната коректорска стъпка (proofreadText/proofreadMission) бе
// премахната — граматичните правила вече са вградени директно в SYSTEM_PROMPT
// на Worker-а (server-side), така че важат за всичко наведнъж, без допълнителни
// бавни API извиквания на всяко съобщение/задача.

async function callClaude(content, isSystem, expectJSON) {
  isLoading = true; sendBtn.disabled = true;
  if(isSystem) conversationHistory.push({role:'user', content});
  const typingEl = appendTyping();
  try {
    const res = await fetch(WEBHOOK_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({system_prompt: SYSTEM_PROMPT + '\n\n' + getCurrentScreenContext(), messages: conversationHistory})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    const reply = data.content.map(b=>b.text||'').join('');
    conversationHistory.push({role:'assistant', content:reply});
    typingEl.remove();

    if (expectJSON) {
      const mission = parseMissionJSON(reply);
      if (mission) {
        moduleState.mat = 'pending';
        moduleState.bel = 'pending';
        moduleState.lit = 'pending';
        moduleTaskProgress = {}; moduleRetryCounts = {};
        missionRetryCount = 0; // успешно — нулираме брояча за следващ път
        renderMissionHubView(mission, todayTheme, mission.intro || '');
        setQuickReplies();
      } else {
        // НИКОГА не показваме суров/счупен отговор на детето (напр. недовършен
        // JSON заради достигнат лимит на токени). Логваме за диагностика, и
        // пробваме автоматично ощe веднъж (с ограничение срещу безкраен цикъл).
        console.error('[Мисия] JSON parse неуспешен, суров отговор от модела:', reply);
        if (missionRetryCount < 1) {
          missionRetryCount++;
          appendMessage('coach', 'Един момент, дай ми да пробвам пак да подготвя днешната мисия… 🔄');
          generateMissionOnDemand();
        } else {
          missionRetryCount = 0;
          hubView.innerHTML = `
            <div class="welcome-screen">
              <div class="ws-icon">😕</div>
              <div class="ws-title">Нещо се обърка</div>
              <div class="ws-message">Не успях да подготвя днешната мисия точно сега. Пробвай отново.</div>
              <div class="missed-day-choice">
                <button class="md-btn primary" id="mission-retry-btn">Опитай пак</button>
              </div>
            </div>`;
          document.getElementById('mission-retry-btn').addEventListener('click', () => {
            missionRetryCount = 0;
            showLoadingScreen();
            generateMissionOnDemand();
          });
          setQuickReplies();
        }
      }
    } else if (lastMessageHadImage) {
      // Снимка ИЛИ текстова поправка по висяща RETRY — Worker-ът извлича
      // "СТАТУС: OK/RETRY/INVALID" И "ЗАДАЧИ: <номера>" от отговора сървърно
      // (виж data.photo_status / data.task_progress), по същия начин, по който
      // вече работи [АДАПТАЦИЯ:...] тагът. Завършването на модула вече се брои
      // от броя потвърдени номера спрямо общия брой задачи — не само от общата
      // холистична преценка на Компас, която може да е непоследователна в едно
      // дълго съобщение накрая на разговор с много поправки.
      lastMessageHadImage = false;
      const status = data.photo_status || 'OK'; // fallback ако липсва (напр. форматът не е спазен)
      const visibleText = cleanMarkdown(reply);
      console.log('[callClaude/снимка] статус (от сървъра):', data.photo_status || '(няма)', '| задачи:', data.task_progress || '(няма)');
      openChat(); // директно разгъваме чата с feedback-а, вместо тихо badge
      appendMessage('coach', visibleText);

      if (status === 'INVALID') {
        // Не е реален опит / съвсем различни задачи — не се брои, не се дава кристал, не се маркира модул
        // Оставяме awaitingCorrectionFor и moduleTaskProgress както са, ако вече имаше висяща поправка.
        setQuickReplies();
      } else {
        const type = pendingModuleCompletion;
        // Обнови кои номера задачи са потвърдени верни (пълно кумулативно състояние, не merge)
        if (data.task_progress !== undefined && type) {
          const doneSet = parseTaskNumbers(data.task_progress);
          moduleTaskProgress[type] = doneSet;
          markTasksDone(type, doneSet);
        }
        const totalTasks = type ? getModuleQuestions(type).length : 0;
        const doneCount = (type && moduleTaskProgress[type]) ? moduleTaskProgress[type].size : 0;
        const allTasksDone = totalTasks > 0 && doneCount >= totalTasks;

        inputEl.placeholder = 'Имаш въпрос? Попитай тук…';

        if (allTasksDone) {
          // Всички номера задачи са потвърдени верни — модулът реално е готов,
          // независимо какво точно е казал Компас холистично в текста.
          awaitingCorrectionFor = null;
          if (!chessUnlocked && type && moduleState[type] !== 'done') {
            appendAckButton(() => completeModule(type, visibleText));
          } else {
            setQuickReplies();
          }
        } else {
          // Все още липсват потвърдени задачи — следващото съобщение по този
          // модул (текст ИЛИ снимка) пак ще мине през преценка.
          awaitingCorrectionFor = type;
          // Броим поправката за дневната оценка (good/needs_work) на този предмет.
          if (type) moduleRetryCounts[type] = (moduleRetryCounts[type] || 0) + 1;
          setQuickReplies();
        }
      }
    } else {
      appendMessage('coach', cleanMarkdown(reply));
      setQuickReplies();
    }
  } catch(err) {
    typingEl.remove();
    appendMessage('coach', `⚠️ Грешка: ${err.message}`);
  }
  isLoading = false; sendBtn.disabled = false;
}

function parseMissionJSON(raw) {
  let s = raw.trim();
  // strip ```json ... ``` fences if present
  s = s.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '');
  // extract from first { to last }
  const start = s.indexOf('{');
  const end = s.lastIndexOf('}');
  if (start === -1 || end === -1) return null;
  s = s.slice(start, end + 1);
  try { return JSON.parse(s); }
  catch(e) { console.error('JSON parse failed:', e, s.slice(0,300)); return null; }
}

function cleanMarkdown(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/^#{1,3}\s+/gm, '')
    .replace(/^---+$/gm, '')
    .trim();
}

        <span class="tab-label">БЕЛ</span>
        <span class="tab-count">${(mission.bel||[]).length}</span>
      </button>
      <button class="tab lit" data-tab="lit">

        <span class="tab-label">ЛИТ</span>
        <span class="tab-count">${(mission.lit&&mission.lit.questions||[]).length}</span>
      </button>
    </div>
    <div class="tab-panel mat" data-panel="mat"><div class="section-tag"><i class="ti ti-ruler" aria-hidden="true"></i> Математика</div></div>
    <div class="tab-panel bel" data-panel="bel"><div class="section-tag"><i class="ti ti-pencil" aria-hidden="true"></i> Български</div></div>
    <div class="tab-panel lit" data-panel="lit"><div class="section-tag"><i class="ti ti-book-2" aria-hidden="true"></i> Литература</div></div>
    <div class="mission-footer">
      <div class="mission-footer-photo">📷 Качи снимка с решението до 17:00ч</div>
      <div class="chess-reward locked" id="chess-reward-main">
        <div class="chess-reward-inner">
          <span class="chess-reward-icon">♟️</span>
          <div class="chess-reward-text">
            <div class="chess-reward-title">Шахматна партия с Компас</div>
            <div class="chess-reward-sub">Качи решението → отключва се достъпът</div>
          </div>
        </div>
      </div>
    </div>
  `;


  // Populate MAT panel
  const matPanel = card.querySelector('.tab-panel[data-panel="mat"]');
  (mission.mat||[]).forEach((task, i) => {
    const row = document.createElement('div');
    row.className = 'task-row mat';
    row.style.setProperty('--task-i', i);
    row.innerHTML = `<div class="task-badge">${i+1}</div><div class="task-text"></div>`;
    row.querySelector('.task-text').textContent = task;
    matPanel.appendChild(row);
  });

  // Populate BEL panel
  const belPanel = card.querySelector('.tab-panel[data-panel="bel"]');
  (mission.bel||[]).forEach((task, i) => {
    const row = document.createElement('div');
    row.className = 'task-row bel';
    row.style.setProperty('--task-i', i);
    row.innerHTML = `<div class="task-badge">${i+1}</div><div class="task-text"></div>`;
    row.querySelector('.task-text').textContent = task;
    belPanel.appendChild(row);
  });

  // Populate LIT panel
  const litPanel = card.querySelector('.tab-panel[data-panel="lit"]');
  if (mission.lit) {
    const litCard = document.createElement('div');
    litCard.className = 'lit-card';
    litCard.innerHTML = `
      <div class="lit-card-top">
        <div class="lit-icon">📜</div>
        <div>
          <div class="lit-work"></div>
          <div class="lit-author"></div>
        </div>
      </div>
      <div class="lit-time">⏱ ${mission.lit.time_estimate || ''}</div>
    `;
    litCard.querySelector('.lit-work').textContent = mission.lit.work || '';
    litCard.querySelector('.lit-author').textContent = mission.lit.author || '';
    litPanel.appendChild(litCard);

    const qWrap = document.createElement('div');
    qWrap.className = 'lit-questions';
    (mission.lit.questions||[]).forEach((q, i) => {
      const row = document.createElement('div');
      row.className = 'task-row lit';
      row.style.setProperty('--task-i', i);
      row.innerHTML = `<div class="task-badge">${i+1}</div><div class="task-text"></div>`;
      row.querySelector('.task-text').textContent = q;
      qWrap.appendChild(row);
    });
    litPanel.appendChild(qWrap);
  }

  // Tab click → smooth scroll to that section (all sections always visible)
  card.querySelectorAll('.tab').forEach(tabBtn => {
    tabBtn.addEventListener('click', () => {
      const panel = card.querySelector(`.tab-panel[data-panel="${tabBtn.dataset.tab}"]`);
      // Pause observer during manual navigation
      observerActive = false;
      // Set active tab immediately
      card.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tabBtn));
      panel.scrollIntoView({ behavior:'smooth', block:'start' });
      // Re-enable observer after scroll settles
      setTimeout(() => { observerActive = true; }, 900);
    });
  });

  // Track which sections have been scrolled past → mark tab as seen
  // Delay observer activation so initial render doesn't trigger false positives
  let observerActive = false;
  setTimeout(() => { observerActive = true; }, 800);

  const observer = new IntersectionObserver((entries) => {
    if (!observerActive) return;
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const name = entry.target.dataset.panel;
        const tab = card.querySelector(`.tab[data-tab="${name}"]`);
        tab.classList.add('seen');
        card.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t===tab));
      }
    });
  }, { root: null, threshold: 0.6 });
  card.querySelectorAll('.tab-panel').forEach(p => observer.observe(p));

  messagesEl.appendChild(card);
  updateChessButtons();

  // Set MAT as active tab immediately
  card.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'mat'));

  // Scroll to MAT section — only when NOT called from requestMission (which handles scroll itself)
  if (!skipScroll) {
    setTimeout(() => {
      const matPanel = card.querySelector('.tab-panel[data-panel="mat"]');
      if (matPanel) matPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      else card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }

  if (window.renderMathInElement) {
    renderMathInElement(card, {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
}

// appendRichMessage — same as appendMessage but uses innerHTML (for Tabler icons in text)
function appendRichMessage(role, html, imgSrc, extraClass) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = extraClass ? `bubble ${extraClass}` : 'bubble';
  if(html) bubble.innerHTML = html;
  if(imgSrc) { const img=document.createElement('img'); img.src=imgSrc; bubble.appendChild(img); }
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = new Date().toLocaleTimeString('bg-BG',{hour:'2-digit',minute:'2-digit'});
  div.appendChild(bubble); div.appendChild(meta);
  messagesEl.appendChild(div);
  return div;
}

// Показва само съобщенията, тагнати за дадения модул (скрива останалите) —
// историята НЕ се трие, само визуално се филтрира кое се вижда в момента.
function filterChatForModule(type) {
  const target = type || 'general';
  messagesEl.querySelectorAll(':scope > [data-module]').forEach(el => {
    el.style.display = (el.dataset.module === target) ? '' : 'none';
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendMessage(role, text, imgSrc) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  // Таг с текущия предмет — използва се за филтриране на изгледа (не изтриване),
  // за да не се вижда БЕЛ съобщение, докато си на МАТ, но историята пак да я има.
  div.dataset.module = currentModuleType || 'general';
  const bubble = document.createElement('div');

// Изпълнява се едва след като детето натисне "Разбрах" — тук вече броим деня/модула за завършен
function completeModule(completedType, feedbackText) {
  awardCrystal('amethyst'); // crystal per photo reviewed
  moduleState[completedType] = 'done';
  pendingModuleCompletion = null;
  const doneNow = getDoneCount();
  const wasWorkingOnPastDate = !!workingOnDate;

  // Статистика за резюмето на екрана: колко задачи, колко поправки бяха нужни.
  const totalTasks = getModuleQuestions(completedType).length;
  const doneTasks = (moduleTaskProgress[completedType] || new Set()).size;
  const retries = moduleRetryCounts[completedType] || 0;
  const statLine = retries === 0
    ? `${doneTasks}/${totalTasks} задачи — всичко от раз, силна работа! 💪`
    : `${doneTasks}/${totalTasks} задачи — стигна дотук след упорита работа, това е важното! 💪`;
  // Кратко резюме "какво упражни" — преизползваме реалния feedback текст на
  // Компас (вече написан за детето). ВАЖНО: вземаме ПОСЛЕДНИЯ параграф, не
  // първите символи — Компас обикновено пише проверка на стъпките в началото
  // ("Проверявам задача 3...") и хубавото обобщение чак накрая.
  const feedbackParagraphs = (feedbackText || '').split(/\n+/).map(p => p.trim()).filter(Boolean);
  const lastParagraph = feedbackParagraphs.length ? feedbackParagraphs[feedbackParagraphs.length - 1] : '';
  const summarySnippet = lastParagraph
    ? (lastParagraph.length > 200 ? lastParagraph.slice(0, 200).trim() + '…' : lastParagraph)
    : '';

  // Записваме завършването в backend-а (fire-and-forget — не блокираме UI, не е критично
  // ако мрежата гръмне) — нужно за да "Прогрес" екранът показва реално какво е свършено.
  // Ако довършваме СТАРА (вчерашна) мисия, записваме под РЕАЛНАТА ѝ дата, не под днес.
  // При ЛИТ подаваме и заглавие/автор, за да се отбележи в ReadingProgress като прочетено.
  fetch(WEBHOOK_URL + '/complete', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      date: workingOnDate || new Date().toISOString().slice(0,10),
      module: completedType,
      work: completedType === 'lit' ? (currentMission?.lit?.work || '') : undefined,
      author: completedType === 'lit' ? (currentMission?.lit?.author || '') : undefined,
    })
  }).catch(e => console.warn('[completeModule] запис на завършване се провали:', e));

  // Ако точно сега се завършват и трите модула за ДНЕШНАТА мисия (не при
  // довършване на стара/вчерашна), пращаме дневно резюме — статус completed +
  // оценка good/needs_work по предмет (според броя нужни поправки) + обобщение
  // на бележките за адаптация от деня, всичко в Missions реда за тази дата.
  if (!wasWorkingOnPastDate && doneNow >= 3) {
    fetch(WEBHOOK_URL + '/complete-day', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        date: new Date().toISOString().slice(0,10),
        matRetries: moduleRetryCounts.mat || 0,
        belRetries: moduleRetryCounts.bel || 0,
        litRetries: moduleRetryCounts.lit || 0,
      })
    }).catch(e => console.warn('[completeModule] дневно резюме се провали:', e));
  }

  // Refresh hub card in place (behind the scenes)
  if (hubCardEl) {
    const parent = hubCardEl.parentNode;
    const next = hubCardEl.nextSibling;
    parent.removeChild(hubCardEl);
    const newHub = renderMissionList(currentMission, true);
    if (next) parent.insertBefore(newHub, next);
    hubCardEl = newHub;
  }

  // Ако току-що довършихме ПОСЛЕДНИЯ липсващ модул от ВЧЕРАШНА мисия — вместо
  // обичайния celebration екран, предложи директен преход към днешната мисия.
  if (wasWorkingOnPastDate) {
    const allDone = ['mat','bel','lit'].every(m => moduleState[m] === 'done');
    if (allDone) {
      workingOnDate = null;
      showFeedbackNotification();
      showYesterdayFinishedTransition();
      setQuickReplies();
      return;
    }
  }

  // Show module done celebration in main pane — скриваме (не трием!) другите
  // построени карти, за да не изгубят маркираните задачи на другите модули.
  const cfg = MODULE_CFG[completedType];
  const isLastModule = doneNow >= 3 && !chessUnlocked; // точно сега се отключва шахът
  Array.from(moduleViewEl.children).forEach(child => { child.style.display = 'none'; });
  const celebrationEl = document.createElement('div');

  if (isLastModule) {
    celebrationEl.innerHTML = `
      <div class="module-done-view">
        <div class="mdv-icon">♟️</div>
        <div class="mdv-title" style="color:${cfg.color}">${cfg.name} — завършено!</div>
        <div class="mdv-stat">${statLine}</div>
        ${summarySnippet ? `<div class="mdv-summary">${summarySnippet}</div>` : ''}
        <div class="mdv-sub">Три от три готови за днес — шахът е отключен!</div>
        <button class="mdv-btn" id="mdv-chess-btn">
          ♟️ Играй шах сега
        </button>
        <button class="mdv-btn mdv-btn-secondary" id="mdv-back-btn">
          <i class="ti ti-layout-grid"></i> Обратно към мисията
        </button>
      </div>`;
  } else {
    celebrationEl.innerHTML = `
      <div class="module-done-view">
        <div class="mdv-icon">🎉</div>
        <div class="mdv-title" style="color:${cfg.color}">${cfg.name} — завършено!</div>
        <div class="mdv-stat">${statLine}</div>
        ${summarySnippet ? `<div class="mdv-summary">${summarySnippet}</div>` : ''}
        <button class="mdv-btn" id="mdv-back-btn">
          <i class="ti ti-layout-grid"></i> Обратно към мисията${!chessUnlocked ? '' : ' — ♟️ шахът те чака'}
        </button>
      </div>`;
  }
  moduleViewEl.appendChild(celebrationEl);
  document.getElementById('mdv-back-btn').addEventListener('click', () => {
    celebrationEl.remove();
    showHubView();
  });
  if (isLastModule) {
    document.getElementById('mdv-chess-btn').addEventListener('click', () => {
      celebrationEl.remove();
      showHubView();
      openChess();
    });
  }
  // ВАЖНО: премахнат автоматичен timeout за навигация — преди екранът изчезваше
  // сам след 4 сек, независимо дали детето е искало да го разгледа по-дълго.
  // Сега остава, докато детето само не натисне бутон.

  // Show "check chat" notification in main pane
  showFeedbackNotification();

  if (doneNow >= 3 && !chessUnlocked) {
    chessUnlocked = true;
    updateChessButtons(true);
    awardCrystal('quartz');
  }
  setQuickReplies();
}

let moduleRetryCounts = {}; // { mat: 2, bel: 0, lit: 1 } — брой пъти получен RETRY за модула тази мисия (за дневната оценка good/needs_work)

// Маркира кои номера задачи са потвърдени верни директно върху номерцата в изгледа
// на модула (зелена отметка вместо номер) — завършването се брои от това, не само
// от общата холистична преценка на Компас.
// Парсва "ЗАДАЧИ:" реда гъвкаво — поддържа и списък с номера (1,2,3), и
// диапазони (1-5), тъй като моделът понякога пише "1-5" вместо да изброява
// всяко число поотделно (точно бъгът, който хвана потребителят — при "1-5"
// старото парсиране връщаше празен резултат, губейки цялото потвърждение).
function parseTaskNumbers(raw) {
  const result = new Set();
  String(raw || '').split(',').forEach(part => {
    part = part.trim();
    const rangeMatch = part.match(/^(\d+)\s*-\s*(\d+)$/);
    if (rangeMatch) {
      const start = parseInt(rangeMatch[1], 10), end = parseInt(rangeMatch[2], 10);
      for (let n = start; n <= end && n - start < 50; n++) result.add(n); // защита от абсурдно голям диапазон
    } else {
      const n = parseInt(part, 10);
      if (!isNaN(n)) result.add(n);
    }
  });
  return result;
}

const CRYSTALS = {
  amethyst:  { emoji: '💎', name: 'Аметист',  sub: 'За прегледана снимка' },
  quartz:    { emoji: '🔮', name: 'Кварц',     sub: 'За завършена мисия' },
  pyrite:    { emoji: '✨', name: 'Пирит',     sub: 'За активен ден' },
  tourmaline:{ emoji: '🌟', name: 'Турмалин',  sub: 'За 7 дни поред' },
};

function loadGameState() {
  try {
    const saved = localStorage.getItem('kompas_game');
    return saved ? JSON.parse(saved) : {
      streak: 0, lastActiveDate: null,
      crystals: { amethyst:0, quartz:0, pyrite:0, tourmaline:0 }
    };
  } catch(e) {
    return { streak:0, lastActiveDate:null, crystals:{amethyst:0,quartz:0,pyrite:0,tourmaline:0} };
  }
}

function saveGameState(state) {
  try { localStorage.setItem('kompas_game', JSON.stringify(state)); } catch(e) {}
}

function getTodayStr() {
  return new Date().toISOString().slice(0, 10);
}

function updateStreakDisplay(streak) {
  const badge = document.getElementById('streak-badge');
  if (!badge) return;
  if (streak > 0) {
    badge.textContent = `${streak} ${streak === 1 ? 'ден' : 'дни'} поред`;
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }
}

function awardDailyPyrite() {
  const state = loadGameState();
  const today = getTodayStr();
  if (state.lastActiveDate === today) return; // already counted today

  // Update streak
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (state.lastActiveDate === yesterday) {
    state.streak++;
  } else if (state.lastActiveDate !== today) {
    state.streak = 1; // reset or start
  }
  state.lastActiveDate = today;

  // Award pyrite
  state.crystals.pyrite++;
  saveGameState(state);
  updateStreakDisplay(state.streak);
  showCrystalToast('pyrite');

  // Check 7-day streak milestone
  if (state.streak > 0 && state.streak % 7 === 0) {
    setTimeout(() => {
      state.crystals.tourmaline++;
      saveGameState(state);
      showCrystalToast('tourmaline');
    }, 2000);
  }
}

function awardCrystal(type) {
  const state = loadGameState();
  state.crystals[type] = (state.crystals[type] || 0) + 1;
  saveGameState(state);
  showCrystalToast(type);
}

let toastTimeout = null;
function showCrystalToast(type) {
  const c = CRYSTALS[type];
  if (!c) return;
  const toast = document.getElementById('crystal-toast');
  document.getElementById('ct-icon').textContent = c.emoji;
  document.getElementById('ct-title').textContent = c.name + ' +1';
  document.getElementById('ct-sub').textContent = c.sub;
  toast.classList.add('visible');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('visible'), 3000);
}

  const chessCard = document.createElement('div');
  chessCard.className = `ml-card ${allDone ? '' : 'locked-card'}`;
  const chessMotivation = doneCount === 0 ? 'Завърши 3-те модула → играй шах!'
    : doneCount === 1 ? '🔥 Още 2 модула до шаха!'
    : doneCount === 2 ? '🔥🔥 Още 1 модул! Почти там!'
    : '🏆 Готово за игра!';
  chessCard.innerHTML = `
    <div class="ml-icon" style="font-size:26px">♟️</div>
    <div class="ml-info">
      <div class="ml-name" style="color:${allDone?'#fbbf24':'#e2b84a'};font-size:15px">Шахмат с Компас</div>
      <div class="ml-meta" style="color:${allDone?'#fbbf24':'#c9973a'}">${chessMotivation}</div>
    </div>
    <i class="ti ${allDone?'ti-chevron-right':'ti-lock'} ml-arrow" style="color:${allDone?'#fbbf24':'#a07020'}"></i>`;
  if (allDone) chessCard.addEventListener('click', () => openChess());
  chessRow.appendChild(chessCard);
  list.appendChild(chessRow);

  card.appendChild(list);
  hubView.innerHTML = '';
  hubView.appendChild(card);
  hubCardEl = card;
  return card;
}

function refreshHub() {
  if (!hubCardEl || !currentMission) return;
  const parent = hubCardEl.parentNode;
  const next = hubCardEl.nextSibling;

  // Build new hub card without appending
  const doneCount = getDoneCount();
  const allDone = doneCount === 3;
  const newCard = document.createElement('div');
  newCard.className = 'mission-hub';

  // Re-run renderMissionList logic but insert in place
  const newHub = renderMissionListEl(currentMission);
  hubView.innerHTML = '';
  hubView.appendChild(newHub);
  hubCardEl = newHub;
}

function renderMissionListEl(mission) {
  // Same as renderMissionList but returns element without appending
  currentMission = mission;
  const doneCount = getDoneCount();
  const allDone = doneCount === 3;
  const card = document.createElement('div');
  card.className = 'mission-hub';
  hubCardEl = card;
  const header = document.createElement('div');
  header.className = 'hub-header';
  const themeSubtitle = currentTheme
    ? `<div class="hub-theme-sub"><span style="color:${getThemeColor(currentTheme)}">${currentTheme.emoji} ${currentTheme.label}</span> — днешно вдъхновение</div>`
    : '';
  header.innerHTML = `
    <div>
      <span class="hub-title">Дневна мисия</span>
      ${themeSubtitle}
    </div>
    <span class="hub-done-count ${allDone?'all-done':''}">${doneCount}/3${allDone?' ✓':''}</span>`;
  card.appendChild(header);
  const list = document.createElement('div');
  list.className = 'module-list';
  const modules = ['mat','bel','lit'];
  modules.forEach((type, idx) => {
    const cfg = MODULE_CFG[type];
    const status = moduleState[type];
    const isDone = status === 'done';
    const isStarted = status === 'started';
    const prevDone = modules.slice(0, idx).every(t => moduleState[t] === 'done' || moduleState[t] === 'started');
    const isRec = !isDone && !isStarted && prevDone;
    const tasks = getModuleQuestions(type);
    const count = tasks.length;
    const litWork = type === 'lit' && mission.lit?.work ? ` · ${mission.lit.work}` : '';
    if (idx > 0) { const line = document.createElement('div'); line.className = 'ml-line'; list.appendChild(line); }
    const row = document.createElement('div');
    row.className = 'ml-row';
    const dot = document.createElement('div');
    dot.className = `ml-dot ${isDone ? 'done-dot' : isStarted ? cfg.dotClass : isRec ? cfg.dotClass : ''}`;
    row.appendChild(dot);
    const mc = document.createElement('div');
    const statusDot = isDone ? '<span class="ml-status-dot done-s"></span>'
      : isStarted ? '<span class="ml-status-dot started-s"></span>' : '';
    const statusText = isDone ? '✓ Завършено' : isStarted ? '⏳ В процес...' : count + ' ' + cfg.label + litWork;
    mc.className = `ml-card ${isDone ? 'done-card' : isStarted ? 'started-card' : ''} ${isRec ? cfg.recClass : ''}`;
    mc.innerHTML = `<div class="ml-icon"><i class="ti ${cfg.icon}" style="color:${isDone?'#4ade80':cfg.color}"></i></div><div class="ml-info"><div class="ml-name" style="color:${isDone?'#4ade80':cfg.color}">${cfg.name}</div><div class="ml-meta" style="${isStarted?'color:#f7b731':''}">${statusText}</div></div>${isRec?'<span class="ml-rec-badge">Препоръчано</span>':''}${statusDot}<i class="ti ${isDone?'ti-check':'ti-chevron-right'} ml-arrow" style="color:${isDone?'#4ade80':'var(--muted)'}"></i>`;
    if (!isDone) mc.addEventListener('click', () => openModule(type));
    row.appendChild(mc);
    list.appendChild(row);
  });
  const chessLine = document.createElement('div'); chessLine.className = 'ml-line'; list.appendChild(chessLine);
  const chessRow = document.createElement('div'); chessRow.className = 'ml-row';
  const chessDot = document.createElement('div'); chessDot.className = `ml-dot ${allDone ? 'done-dot' : 'locked-dot'}`; chessRow.appendChild(chessDot);
  const chessCard = document.createElement('div');
  chessCard.className = `ml-card ${allDone ? '' : 'locked-card'}`;
  const chessMotivation = doneCount === 0 ? 'Завърши 3-те модула → играй шах!'
    : doneCount === 1 ? '🔥 Още 2 модула до шаха!'
    : doneCount === 2 ? '🔥🔥 Още 1 модул! Почти там!'
    : '🏆 Готово за игра!';
  chessCard.innerHTML = `<div class="ml-icon" style="font-size:26px">♟️</div><div class="ml-info"><div class="ml-name" style="color:${allDone?'#fbbf24':'#e2b84a'}">Шахмат с Компас</div><div class="ml-meta" style="color:${allDone?'#fbbf24':'#c9973a'}">${chessMotivation}</div></div><i class="ti ${allDone?'ti-chevron-right':'ti-lock'} ml-arrow" style="color:${allDone?'#fbbf24':'#a07020'}"></i>`;
  if (allDone) chessCard.addEventListener('click', () => openChess());
  chessRow.appendChild(chessCard);
  list.appendChild(chessRow);
  card.appendChild(list);
  return card;
}

// ── Module overlay ──
const moduleOverlay = document.getElementById('module-overlay');
const moBack = document.getElementById('mo-back');
const moTitleEl = document.getElementById('mo-title');
const moProgTextEl = document.getElementById('mo-prog-text');
const moProgFill = document.getElementById('mo-prog-fill');
const moBodyEl = document.getElementById('mo-body');
const moFooterEl = document.getElementById('mo-footer');

moBack.addEventListener('click', () => {
  moduleOverlay.classList.remove('visible');
});

function openModule(type) {
  // Ако влизаме в ДРУГ модул — филтрираме кои съобщения в чата се ВИЖДАТ
  // (по data-module таг), вместо да ги трием. Историята остава напълно
  // непокътната — просто показваме само релевантното за текущия предмет.
  if (chatDisplayModule !== type) {
    filterChatForModule(type);
    chatDisplayModule = type;
    inputEl.placeholder = 'Напиши съобщение…';
    clearQuickReplies();
  }
  currentModuleType = type;

  // Ако вече е построен (отварян преди в тази сесия) — просто го покажи отново.
  // ПРЕДИ тук само се скролираше, но showHubView() крие moduleViewEl (display:none)
  // без да чисти moduleCards[type], затова изгледът оставаше скрит и нищо не се
  // случваше видимо при повторен клик — точно бъгът, който хвана потребителят.
  if (moduleCards[type] && moduleCards[type].isConnected) {
    Array.from(moduleViewEl.children).forEach(child => { child.style.display = 'none'; });
    moduleCards[type].style.display = 'block';
    hubView.style.display = 'none';
    moduleViewEl.style.display = 'block';
    mainPane.scrollTop = 0;
    return;
  }

  // Mark as started
  if (moduleState[type] === 'pending') {
    moduleState[type] = 'started';
    refreshHub();
  }

  // Append inline module detail card to chat
  const cfg = MODULE_CFG[type];
  const questions = getModuleQuestions(type);
  const litInfo = type === 'lit' ? currentMission?.lit : null;

  const card = document.createElement('div');
  card.className = 'module-detail-card';

  // Register card (prevent duplicates)
  moduleCards[type] = card;

  // Header with back button and progress context
  const hdr = document.createElement('div');
  hdr.className = 'mdc-header';
  const doneNow = getDoneCount();
  hdr.innerHTML = `
    <button class="mdc-back-btn" title="Назад към модулите">
      <i class="ti ti-arrow-left" style="font-size:18px;"></i>
    </button>
    <i class="ti ${cfg.icon}" style="font-size:18px;color:${cfg.color};flex-shrink:0"></i>
    <span class="mdc-title" style="color:${cfg.color};flex:1">${cfg.name}</span>
    <span class="mdc-back-pill">${doneNow}/3 <i class="ti ti-layout-grid" style="font-size:12px;vertical-align:-1px;"></i></span>`;
  const scrollToHub = () => showHubView();
  hdr.querySelector('.mdc-back-btn').addEventListener('click', scrollToHub);
  hdr.querySelector('.mdc-back-pill').addEventListener('click', scrollToHub);
  card.appendChild(hdr);

  // LIT book card if applicable
  if (litInfo && litInfo.work) {
    const litCard = document.createElement('div');
    litCard.className = 'lit-card';
    litCard.style.margin = '0 16px';
    litCard.innerHTML = `
      <div class="lit-card-top">
        <div class="lit-icon">📜</div>
        <div><div class="lit-work">${litInfo.work}</div><div class="lit-author">${litInfo.author||''}</div></div>
      </div>
      <div class="lit-time">⏱ ${litInfo.time_estimate||''}</div>`;
    card.appendChild(litCard);
  }

  // All tasks visible
  questions.forEach((q, i) => {
    const row = document.createElement('div');
    row.className = 'task-row ' + type;
    row.dataset.taskNum = i + 1;
    row.style.setProperty('--task-i', i);
    row.innerHTML = `<div class="task-badge"><span class="tb-num">${i+1}</span><i class="ti ti-check tb-check"></i></div><div class="task-text"></div>`;
    row.querySelector('.task-text').textContent = q;
    card.appendChild(row);
  });

  // Footer
  const ftr = document.createElement('div');
  ftr.className = 'mdc-footer';
  ftr.innerHTML = `<span class="mdc-hint">Реши на хартия, после качи снимка</span><button class="mdc-upload-btn"><i class="ti ti-camera"></i> Качи снимка</button>`;
  ftr.querySelector('.mdc-upload-btn').addEventListener('click', () => {
    pendingModuleCompletion = type;
    openChat();
    fileInput.click();
  });
  card.appendChild(ftr);

  // ВАЖНО: скриваме предишните построени карти (не ги трием!) — преди тук
  // moduleViewEl.innerHTML = '' изтриваше изцяло предишната карта на друг
  // модул, което разкачваше нейния DOM възел (isConnected става false).
  // При връщане тя се строеше наново от нулата, губейки маркираните с ✓
  // задачи (moduleTaskProgress checkmarks) — точно бъгът, който потребителят хвана.
  Array.from(moduleViewEl.children).forEach(child => { child.style.display = 'none'; });
  moduleViewEl.appendChild(card);
  card.style.display = 'block';
  // Show module view, hide hub
  hubView.style.display = 'none';
  moduleViewEl.style.display = 'block';
  mainPane.scrollTop = 0;

  if (window.renderMathInElement && type === 'mat') {
    renderMathInElement(card, { delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false });
  }
}

function renderQuestion() {
  const questions = getModuleQuestions(currentModuleType);
  const total = questions.length;
  const idx = currentQuestionIdx;
  const pct = ((idx + 1) / total) * 100;

  moProgTextEl.textContent = `${idx + 1} / ${total}`;
  moProgFill.style.width = pct + '%';

  moBodyEl.innerHTML = `
    <div class="mo-q-num">Задача ${idx + 1} от ${total}</div>
    <div class="mo-q-text">${questions[idx] || ''}</div>`;

  const isLast = idx === total - 1;
  moFooterEl.innerHTML = `<button class="mo-btn" id="mo-next-btn">${isLast ? '<i class="ti ti-camera"></i> Готово — качи снимка' : 'Следваща <i class="ti ti-arrow-right"></i>'}</button>`;
  document.getElementById('mo-next-btn').addEventListener('click', isLast ? showModuleDone : () => {
    currentQuestionIdx++;
    renderQuestion();
  });
}

function showModuleDone() {
  moBodyEl.innerHTML = `
    <div class="mo-done-area">
      <div class="mo-done-icon">📷</div>
      <div class="mo-done-title">Качи снимката!</div>
      <div class="mo-done-sub">Реши всички задачи на хартия, направи снимка и ще получиш feedback от Компас.</div>
    </div>`;
  moFooterEl.innerHTML = `<button class="mo-btn" id="mo-upload-btn"><i class="ti ti-camera"></i> Качи снимка</button>`;
  document.getElementById('mo-upload-btn').addEventListener('click', () => {
    pendingModuleCompletion = currentModuleType;
    moduleOverlay.classList.remove('visible');
    openChat();
    fileInput.click();
  });
}

const PIECE_GLYPHS = {
  wK:'♔', wQ:'♕', wR:'♖', wB:'♗', wN:'♘', wP:'♙',
  bK:'♚', bQ:'♛', bR:'♜', bB:'♝', bN:'♞', bP:'♟'
};

const KOMPAS_FLAVOR = [
  'Хм, интересен ход...', 'Виждам плана ти 😏', 'Добре обмислено.',
  'Трябва да внимавам.', 'Не лошо, не лошо.', 'Сериозен си!',
  'Ок, мой ред.', '🤔 Нека помисля...', 'Учиш бързо!',
];

const chessOverlay = document.getElementById('chess-overlay');
const chessBoardEl = document.getElementById('chess-board');
const chessStatusEl = document.getElementById('chess-status');
const chessTurnEl = document.getElementById('chess-turn');
const chessResultEl = document.getElementById('chess-result');
const chessCloseBtn = document.getElementById('chess-close-btn');
const chessNewBtn = document.getElementById('chess-new-btn');

chessCloseBtn.addEventListener('click', () => chessOverlay.classList.remove('visible'));
chessNewBtn.addEventListener('click', initChessGame);
chessOverlay.addEventListener('click', e => {
  if(e.target === chessOverlay) chessOverlay.classList.remove('visible');
});

function openChess() {
  if (!chessUnlocked) return;
  chessOverlay.classList.add('visible');
  if (!chess) initChessGame();
}

function updateChessButtons(isNewUnlock) {
  // Show/hide floating button
  const floatBtn = document.getElementById('chess-float-btn');
  if (floatBtn) floatBtn.classList.toggle('visible', chessUnlocked);

  document.querySelectorAll('.chess-reward').forEach(card => {
    if (chessUnlocked) {
      card.className = 'chess-reward unlocked' + (isNewUnlock ? ' just-unlocked' : '');
      // Rebuild inner with play button
      card.innerHTML = `
        <div class="chess-reward-inner">
          <span class="chess-reward-icon">♟️</span>
          <div class="chess-reward-text">
            <div class="chess-reward-title">Шахматна партия с Компас</div>
            <div class="chess-reward-sub">Готово за игра! 🏆</div>
          </div>
          <button class="chess-play-btn" onclick="openChess()">Играй →</button>
        </div>`;
      if (isNewUnlock) {
        setTimeout(() => card.classList.remove('just-unlocked'), 1500);
      }
    } else {
      card.className = 'chess-reward locked';
      const remaining = PHOTOS_REQUIRED - photoReviewCount;
      const progress = photoReviewCount > 0
        ? `📷 ${photoReviewCount}/${PHOTOS_REQUIRED} снимки качени`
        : `Качи снимки с решенията, за да отключиш`;
      card.innerHTML = `
        <div class="chess-reward-inner">
          <span class="chess-reward-icon">♟️</span>
          <div class="chess-reward-text">
            <div class="chess-reward-title">Шахматна партия с Компас</div>
            <div class="chess-reward-sub">${progress} — нужни: ${PHOTOS_REQUIRED}</div>
          </div>
          <div class="chess-progress-pills">
            ${Array.from({length: PHOTOS_REQUIRED}, (_, i) =>
              `<span class="chess-pip ${i < photoReviewCount ? 'done' : ''}"></span>`
            ).join('')}
          </div>
        </div>`;
    }
  });
}

function initChessGame() {
  chess = new Chess();
  selectedSq = null;
  validMoves = [];
  chessThinking = false;
  chessResultEl.style.display = 'none';
  chessStatusEl.textContent = 'Ти си Бели ♔ — направи първия ход!';
  chessStatusEl.className = 'chess-status';
  renderChessBoard();
  updateTurnIndicator();
}

function renderChessBoard() {
  chessBoardEl.innerHTML = '';
  const board = chess.board(); // 8x8 array, rank 8 first
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = String.fromCharCode(97+f) + (8-r); // e.g. 'e4'
      const cell = board[r][f];
      const isLight = (r + f) % 2 === 0;
      const div = document.createElement('div');
      div.className = 'sq ' + (isLight ? 'light' : 'dark');
      div.dataset.sq = sq;

      if (selectedSq === sq) div.classList.add('selected');
      if (validMoves.includes(sq)) {
        div.classList.add(cell ? 'valid-capture' : 'valid-move');
      }
      if (cell) div.textContent = PIECE_GLYPHS[cell.color + cell.type.toUpperCase()] || '';

      div.addEventListener('click', () => handleChessClick(sq));
      chessBoardEl.appendChild(div);
    }
  }
}

function handleChessClick(sq) {
  if (chess.game_over() || chessThinking || chess.turn() !== 'w') return;

  const piece = chess.get(sq);

  if (selectedSq) {
    // Try to make move
    if (validMoves.includes(sq)) {
      // Check pawn promotion
      let move = { from: selectedSq, to: sq };
      const p = chess.get(selectedSq);
      if (p && p.type === 'p' && (sq[1] === '8' || sq[1] === '1')) move.promotion = 'q';

      const result = chess.move(move);
      if (result) {
        selectedSq = null; validMoves = [];
        renderChessBoard();
        if (chess.game_over()) { handleChessEnd(); return; }
        chessThinking = true;
        chessStatusEl.textContent = KOMPAS_FLAVOR[Math.floor(Math.random()*KOMPAS_FLAVOR.length)];
        chessStatusEl.className = 'chess-status thinking';
        updateTurnIndicator();
        setTimeout(() => getKompasMove(), 800);
        return;
      }
    }
    // Deselect or select new piece
    selectedSq = null; validMoves = [];
    if (piece && piece.color === 'w') {
      selectedSq = sq;
      validMoves = chess.moves({square: sq, verbose: true}).map(m => m.to);
    }
  } else {
    if (piece && piece.color === 'w') {
      selectedSq = sq;
      validMoves = chess.moves({square: sq, verbose: true}).map(m => m.to);
    }
  }
  renderChessBoard();
}

async function getKompasMove() {
  const allMoves = chess.moves();
  if (!allMoves.length) { handleChessEnd(); return; }

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        system_prompt: `Ти играеш шах на ниво ~1300 ELO. Правиш предимно добри ходове, но понякога допускаш малки грешки, за да може опонентът (12-годишно момче) да има реален шанс да спечели. Отговаряй САМО с един ход в SAN нотация, нищо друго.`,
        messages: [{
          role: 'user',
          content: `FEN: ${chess.fen()}\nВалидни ходове: ${allMoves.join(', ')}\nИзбери един ход за Черни.`
        }]
      })
    });
    const data = await res.json();
    const rawMove = (data.content?.[0]?.text || '').trim().replace(/[.!?]/g,'').split(' ')[0];

    // Validate the move is in allMoves list
    const move = allMoves.find(m => m === rawMove) || allMoves[Math.floor(Math.random()*allMoves.length)];
    chess.move(move);
  } catch(e) {
    // Fallback to random move
    const moves = chess.moves();
    if (moves.length) chess.move(moves[Math.floor(Math.random()*moves.length)]);
  }

  chessThinking = false;
  selectedSq = null; validMoves = [];
  renderChessBoard();
  updateTurnIndicator();

  if (chess.game_over()) { handleChessEnd(); return; }

  if (chess.in_check()) {
    chessStatusEl.textContent = '⚠️ Шах! Защити краля.';
  } else {
    chessStatusEl.textContent = 'Твой ред — Бели ♔';
  }
  chessStatusEl.className = 'chess-status';
}

function updateTurnIndicator() {
  chessTurnEl.textContent = chess.turn() === 'w' ? 'На ход: ⬜ Бели (ти)' : 'На ход: ⬛ Черни (Компас)';
}

function handleChessEnd() {
  chessResultEl.style.display = 'block';
  if (chess.in_checkmate()) {
    if (chess.turn() === 'b') {
      chessResultEl.textContent = '🏆 Спечели! Мат на Компас!';
      chessResultEl.className = 'chess-result win';
      chessStatusEl.textContent = 'Честито! Сигурно си учил добре 😄';
    } else {
      chessResultEl.textContent = '♟️ Компас спечели. Пробвай пак!';
      chessResultEl.className = 'chess-result lose';
      chessStatusEl.textContent = 'Следващия път ще е по-трудно да ме победиш 😏';
    }
  } else if (chess.in_draw()) {
    chessResultEl.textContent = '🤝 Реми!';
    chessResultEl.className = 'chess-result draw';
    chessStatusEl.textContent = 'Добра игра и от двете страни.';
  }
  chessStatusEl.className = 'chess-status';
}
